<script>
const screens = [{"eyebrow": "Bienvenue", "title": "Rédiger et sécuriser un acte administratif en Nouvelle-Calédonie", "body": "\n<div class=\"intro-layout\">\n  <div class=\"intro-copy\">\n    <p class=\"intro-hook\">Un acte administratif ne commence pas avec <strong>« Vu… »</strong>.</p>\n    <p class=\"lead\">Il commence par une série de vérifications : <strong>qui peut décider, sur quel fondement, selon quelle procédure et avec quelles formalités ensuite.</strong></p>\n\n    <div class=\"mission-card\">\n      <div class=\"mission-label\">Votre mission</div>\n      <div class=\"mission-text\">Préparer un projet d’acte fiable, repérer les points à sécuriser et savoir quand demander une validation complémentaire.</div>\n    </div>\n\n    <div class=\"intro-meta\">\n      <span><strong>≈ 55 min</strong><small>durée indicative</small></span>\n      <span><strong>4 dossiers</strong><small>situations professionnelles</small></span>\n      <span><strong>1 méthode</strong><small>réutilisable au quotidien</small></span>\n    </div>\n  </div>\n\n  <div class=\"intro-visual master-visual-wrap\">\n      <img class=\"master-visual opening-master\" src=\"assets/01_ouverture.webp\"\n           alt=\"Dossier administratif en cours d’analyse sur un bureau, entouré de plusieurs pièces utiles à sa vérification.\">\n    </div>\n</div>\n\n<div class=\"start-note\">\n  <span class=\"start-dot\"></span>\n  <span>Vous n’aurez pas à mémoriser des numéros d’articles. Vous apprendrez surtout <strong>quoi vérifier et dans quel ordre</strong>.</span>\n</div>\n"}, {"eyebrow": "Mise en situation", "title": "La demande tombe. Vous faites quoi en premier ?", "body": "\n<div class=\"message-stage\">\n  <div class=\"message-head\">\n    <span class=\"status-dot\"></span>\n    <div><strong>Votre responsable</strong><small>Message reçu à l’instant</small></div>\n    <span class=\"urgent-pill\">À traiter aujourd’hui</span>\n  </div>\n  <div class=\"message-bubble\">\n    « Nous avons pris la décision. Peux-tu préparer l’acte et me le transmettre pour signature aujourd’hui ? »\n  </div>\n</div>\n\n<div class=\"old-file-row\">\n  <div class=\"old-file-icon\" aria-hidden=\"true\">\n    <span></span><span></span><span></span>\n  </div>\n  <div>\n    <strong>Bonne nouvelle ?</strong>\n    <p>Sur le serveur, vous retrouvez un acte très proche, préparé deux ans auparavant.</p>\n  </div>\n</div>\n\n<div class=\"decision-prompt\">\n  <span class=\"decision-label\">Votre premier réflexe</span>\n  <strong>Que faites-vous avant de commencer à rédiger ?</strong>\n</div>\n", "activity": {"type": "choice", "choices": ["J’ouvre l’ancien acte et je commence à l’adapter.", "Je commence par actualiser les visas.", "Je vérifie d’abord ce que nous voulons décider, qui peut le décider et sur quel fondement."], "correct": 2, "feedback": ["L’ancien acte pourra être utile ensuite. Mais il ne prouve ni la compétence, ni l’actualité des textes, ni que la situation est réellement identique.", "Les visas viennent après. Avant de rechercher les références à citer, il faut savoir quelle décision doit être prise et par quelle autorité.", "C’est le bon réflexe : vous sécurisez d’abord le cadre de la décision. L’ancien acte pourra ensuite servir de support de rédaction."]}}, {"eyebrow": "Premier repère", "title": "Le modèle aide à rédiger. Il ne sécurise pas l’acte.", "body": "\n<div class=\"logic-split\">\n  <div class=\"logic-panel model-panel\">\n    <div class=\"logic-label\">Le modèle peut vous aider</div>\n    <h3>Pour gagner du temps</h3>\n    <ul class=\"clean-list\">\n      <li>retrouver une structure connue ;</li>\n      <li>reprendre une mise en forme ;</li>\n      <li>repérer les rubriques à renseigner.</li>\n    </ul>\n  </div>\n\n  <div class=\"logic-arrow\" aria-hidden=\"true\">≠</div>\n\n  <div class=\"logic-panel secure-panel\">\n    <div class=\"logic-label\">Mais vous devez vérifier</div>\n    <h3>Ce qui fonde réellement l’acte</h3>\n    <ul class=\"clean-list\">\n      <li>la compétence de l’administration ;</li>\n      <li>l’autorité qui peut décider ;</li>\n      <li>les textes et délégations en vigueur ;</li>\n      <li>les formalités à accomplir.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"key-sentence\">\n  <span class=\"key-mark\">!</span>\n  <div><strong>Le piège du copier-coller :</strong> un document peut sembler familier alors que son cadre juridique a changé.</div>\n</div>\n\n<div class=\"micro-question\">\n  <strong>Le bon usage d’un ancien acte ?</strong>\n  <span>Un support de rédaction <em>après</em> avoir vérifié qu’il reste pertinent.</span>\n</div>\n"}, {"eyebrow": "La logique du travail", "title": "Un acte se sécurise avant, pendant et après la rédaction", "body": "\n<div class=\"flowline\">\n  <div class=\"flow-step before\">\n    <div class=\"flow-icon\">1</div>\n    <div class=\"flow-text\">\n      <span class=\"flow-kicker\">Avant</span>\n      <h3>Je vérifie</h3>\n      <p>La décision attendue, la compétence, l’autorité et la procédure.</p>\n    </div>\n  </div>\n\n  <div class=\"flow-connector\" aria-hidden=\"true\">→</div>\n\n  <div class=\"flow-step during\">\n    <div class=\"flow-icon\">2</div>\n    <div class=\"flow-text\">\n      <span class=\"flow-kicker\">Pendant</span>\n      <h3>Je rédige</h3>\n      <p>Des fondements utiles, une motivation si nécessaire et un dispositif clair.</p>\n    </div>\n  </div>\n\n  <div class=\"flow-connector\" aria-hidden=\"true\">→</div>\n\n  <div class=\"flow-step after\">\n    <div class=\"flow-icon\">3</div>\n    <div class=\"flow-text\">\n      <span class=\"flow-kicker\">Après</span>\n      <h3>Je rends l’acte effectif</h3>\n      <p>Signature, contreseing éventuel, notification, publication ou transmission.</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"risk-strip\">\n  <div class=\"risk-symbol\">!</div>\n  <div>\n    <strong>Un acte peut être impeccable à l’écran et rester juridiquement fragile.</strong>\n    <p>La qualité de la rédaction ne compense pas une mauvaise compétence, une délégation absente ou une formalité oubliée.</p>\n  </div>\n</div>\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_01_cycle_complet.webp\" alt=\"Infographie du cycle complet d’un acte : besoin, compétence, rédaction, signature, formalités et caractère exécutoire.\"><div class=\"pedago-info-caption\">Repère visuel : le cycle ne s’arrête pas à la signature.</div></div>"}, {"eyebrow": "Votre fil rouge", "title": "9 questions, regroupées en 3 temps de travail", "body": "\n<p class=\"lead compact-lead\">Vous n’avez pas neuf règles à apprendre. Vous avez <strong>neuf questions à utiliser au bon moment</strong>.</p>\n\n<div class=\"questions-cluster\">\n  <section class=\"cluster cluster-a\">\n    <div class=\"cluster-head\">\n      <span class=\"cluster-num\">01</span>\n      <div><small>Avant de rédiger</small><h3>Je cadre la décision</h3></div>\n    </div>\n    <div class=\"question-chips\">\n      <span>Que veut-on réellement décider ?</span>\n      <span>Quelle administration est compétente ?</span>\n      <span>Quelle autorité peut décider ?</span>\n      <span>Quelle est la nature de l’acte ?</span>\n      <span>Quelle procédure faut-il respecter ?</span>\n      <span>Quels textes fondent la décision ?</span>\n    </div>\n  </section>\n\n  <section class=\"cluster cluster-b\">\n    <div class=\"cluster-head\">\n      <span class=\"cluster-num\">02</span>\n      <div><small>Pendant</small><h3>Je construis l’acte</h3></div>\n    </div>\n    <div class=\"question-chips\">\n      <span>Que faut-il expliquer et décider ?</span>\n    </div>\n  </section>\n\n  <section class=\"cluster cluster-c\">\n    <div class=\"cluster-head\">\n      <span class=\"cluster-num\">03</span>\n      <div><small>Avant de transmettre</small><h3>Je sécurise la suite</h3></div>\n    </div>\n    <div class=\"question-chips\">\n      <span>Qui doit signer ?</span>\n      <span>Que reste-t-il à faire après la signature ?</span>\n    </div>\n  </section>\n</div>\n\n<div class=\"remember-band\">\n  <span class=\"remember-eye\">◎</span>\n  <div><strong>Votre repère pour toute la formation :</strong> à chaque dossier, demandez-vous simplement <em>« où en suis-je dans ces trois temps ? »</em></div>\n</div>\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_02_9_questions.webp\" alt=\"Infographie des neuf questions regroupées en trois temps de travail.\"></div>"}, {"eyebrow": "Votre boîte à outils", "title": "Quel acte dois-je préparer ?", "body": "\n<p class=\"lead compact-lead\">Avant de chercher un modèle, faites un <strong>premier tri fonctionnel</strong>. Il ne remplace pas la vérification juridique, mais il vous aide à poser la bonne question.</p>\n\n<div class=\"act-type-grid\">\n  <article class=\"act-type-card\">\n    <div class=\"act-type-icon\">◎</div>\n    <small>Décision collective</small>\n    <h3>Une assemblée doit décider</h3>\n    <p>Je recherche d’abord le texte qui attribue la compétence à l’organe délibérant et la forme d’acte prévue.</p>\n  </article>\n\n  <article class=\"act-type-card\">\n    <div class=\"act-type-icon\">⚙</div>\n    <small>Règle générale</small>\n    <h3>Une autorité fixe une règle</h3>\n    <p>Je vérifie son pouvoir réglementaire, le champ de la mesure et les formalités de publicité.</p>\n  </article>\n\n  <article class=\"act-type-card\">\n    <div class=\"act-type-icon\">●</div>\n    <small>Situation individuelle</small>\n    <h3>Une personne ou un dossier est visé</h3>\n    <p>Je vérifie notamment compétence, procédure, motivation éventuelle, notification et recours.</p>\n  </article>\n\n  <article class=\"act-type-card\">\n    <div class=\"act-type-icon\">↔</div>\n    <small>Accord entre parties</small>\n    <h3>Il faut organiser des engagements réciproques</h3>\n    <p>Je vérifie si un acte unilatéral suffit réellement ou si un autre instrument, par exemple conventionnel, est requis.</p>\n  </article>\n</div>\n\n<div class=\"act-type-warning\">\n  <span>!</span>\n  <div><strong>Le titre du modèle ne décide jamais à votre place.</strong><p>Si vous hésitez entre plusieurs formes d’acte, le bon réflexe est de revenir au texte qui attribue la compétence ou de faire valider la qualification.</p></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Situation</span><strong>Votre service doit refuser une autorisation demandée par une association identifiée. Quel est votre premier raisonnement ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Je cherche d’abord un modèle nommé « arrêté ».", "Je traite d’abord la situation comme une décision visant un dossier identifié, puis je vérifie la forme prévue par les textes applicables.", "Je choisis une délibération parce qu’elle offre davantage de sécurité."], "correct": 1, "feedback": ["Le nom du fichier ne permet pas de déterminer la bonne forme juridique.", "Exact. On part de l’effet de la décision et des textes applicables, pas du modèle disponible.", "Le niveau de sécurité ne dépend pas du caractère plus ou moins solennel du document."]}}, {"eyebrow": "Votre boîte à outils", "title": "Anatomie d’un acte : à quoi sert chaque partie ?", "body": "\n<div class=\"anatomy-layout\">\n  <div class=\"anatomy-paper\">\n    <div class=\"an-zone az-title\"><span>1</span><div><small>Objet / titre</small><strong>Identifier clairement ce qui est décidé</strong></div></div>\n    <div class=\"an-zone az-visas\"><span>2</span><div><small>Visas / références</small><strong>Afficher les principaux fondements et éléments de procédure utiles</strong></div></div>\n    <div class=\"an-zone az-motifs\"><span>3</span><div><small>Motifs / considérants</small><strong>Expliquer le raisonnement lorsque la décision doit ou mérite d’être motivée</strong></div></div>\n    <div class=\"an-zone az-device\"><span>4</span><div><small>Dispositif / articles</small><strong>Dire précisément ce que l’administration décide</strong></div></div>\n    <div class=\"an-zone az-sign\"><span>5</span><div><small>Signature</small><strong>Identifier l’autorité qui engage l’administration et sa délégation éventuelle</strong></div></div>\n    <div class=\"an-zone az-after\"><span>6</span><div><small>Suite de l’acte</small><strong>Prévoir notification, publication, transmission ou mentions de recours selon le cas</strong></div></div>\n  </div>\n\n  <div class=\"anatomy-side\">\n    <div class=\"anatomy-rule\">\n      <span class=\"legal-symbol\">◎</span>\n      <div><small>Le bon réflexe</small><strong>Chaque bloc doit avoir une fonction.</strong></div>\n    </div>\n    <p>Un acte n’est pas sécurisé parce qu’il contient beaucoup de visas ou plusieurs pages. Il l’est lorsque chaque élément utile est présent, exact et cohérent avec la décision.</p>\n\n    <div class=\"anatomy-test\">\n      <small>Test rapide</small>\n      <strong>Si je masque le titre du document, suis-je encore capable de comprendre qui décide quoi, pourquoi et avec quel effet ?</strong>\n    </div>\n  </div>\n</div>\n\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_03_anatomie.webp\" alt=\"Infographie de l’anatomie d’un acte administratif : objet, visas, motivation, dispositif, signature et formalités.\"></div><div class=\"decision-prompt\"><span class=\"decision-label\">Repérage</span><strong>Quelle partie produit directement l’effet juridique principal de la décision ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Les visas.", "Le dispositif / les articles qui énoncent la décision.", "La signature, à elle seule."], "correct": 1, "feedback": ["Les visas contribuent à montrer les fondements, mais ils n’énoncent pas à eux seuls ce qui est décidé.", "Exact. Le dispositif doit traduire précisément la décision et ses effets.", "La signature est indispensable au circuit de l’acte, mais elle ne remplace pas un dispositif précis."]}}, {"eyebrow": "Votre boîte à outils", "title": "Un dispositif doit pouvoir être appliqué sans deviner", "body": "\n<div class=\"device-before-after\">\n  <section class=\"device-card device-weak\">\n    <div class=\"device-badge\">Trop flou</div>\n    <blockquote>« L’association est autorisée à utiliser la salle municipale dans le cadre de son événement. »</blockquote>\n    <div class=\"missing-points\">\n      <span>Quelle salle ?</span>\n      <span>Quelle date ?</span>\n      <span>Quels horaires ?</span>\n      <span>Quelles conditions ?</span>\n    </div>\n  </section>\n\n  <div class=\"device-arrow\" aria-hidden=\"true\">→</div>\n\n  <section class=\"device-card device-strong\">\n    <div class=\"device-badge\">Exploitable</div>\n    <div class=\"device-structure\">\n      <div><small>Bénéficiaire</small><strong>Association identifiée</strong></div>\n      <div><small>Objet / lieu</small><strong>Salle et espace concernés</strong></div>\n      <div><small>Période</small><strong>Date et horaires précis</strong></div>\n      <div><small>Conditions</small><strong>Obligations utiles et proportionnées</strong></div>\n      <div><small>Effet</small><strong>Date d’entrée en vigueur / fin de l’autorisation</strong></div>\n    </div>\n  </section>\n</div>\n\n<div class=\"device-rule-band\">\n  <span>5Q</span>\n  <div><strong>Pour relire un article :</strong> qui ? quoi ? où ? quand ? sous quelles conditions ?</div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Réécriture</span><strong>Quel énoncé est le plus directement applicable par les agents chargés de l’exécution ?</strong></div>\n", "activity": {"type": "choice", "choices": ["« L’association pourra utiliser la salle prochainement selon les disponibilités. »", "« L’association X est autorisée à utiliser la salle Y le 14 novembre, de 8 h à 18 h, sous réserve du respect des conditions de sécurité annexées à la décision. »", "« L’association est autorisée dans les conditions habituelles. »"], "correct": 1, "feedback": ["« Prochainement » et « selon les disponibilités » laissent trop d’éléments indéterminés.", "Exact. L’énoncé identifie le bénéficiaire, l’objet, le lieu, la période et la condition utile.", "Une référence vague aux « conditions habituelles » oblige le lecteur à deviner ou à rechercher ailleurs ce qui s’applique."]}}, {"eyebrow": "Dossier 1 · Commune", "title": "« Il faut un arrêté pour samedi »", "body": "\n<div class=\"case-opening\">\n  <div class=\"case-person\">\n    <div class=\"case-photo-frame\"><img class=\"case-photo\" src=\"assets/02_melanie_commune.webp\" alt=\"Mélanie analyse un dossier communal avec plans et pièces administratives.\"></div>\n    <div class=\"person-caption\"><span class=\"role-tag\">Gestionnaire administrative</span><h3>Mélanie</h3><p>Elle prépare régulièrement des actes pour son service.</p></div>\n  </div>\n  <div class=\"case-context\">\n    <div class=\"case-label\">La situation</div>\n    <p>Une manifestation est organisée samedi sur la place municipale.</p>\n    <p>Le service technique souhaite <strong>interdire temporairement la circulation automobile dans une rue communale située dans l’agglomération, de 7 h à 18 h.</strong></p>\n  </div>\n</div>\n<div class=\"manager-request\"><span class=\"manager-mark\">↳</span><div><small>Message du responsable</small><strong>« Peux-tu préparer l’arrêté de circulation ? Nous en avions déjà fait un l’année dernière. »</strong></div></div>\n<div class=\"decision-prompt\"><span class=\"decision-label\">Premier réflexe</span><strong>Mélanie doit-elle commencer par l’ancien arrêté ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Oui, le besoin est presque identique.", "Non, elle doit d’abord vérifier le cadre de la décision."], "correct": 1, "feedback": ["Le précédent pourra aider ensuite, mais il ne doit pas être le point de départ du raisonnement.", "Exact. Avant le modèle, Mélanie doit vérifier le besoin, la compétence et le fondement de la décision."]}}, {"eyebrow": "Dossier 1 · Commune", "title": "Avant le modèle, ouvrez le dossier", "body": "\n<p class=\"lead compact-lead\">Trois pièces suffisent déjà à orienter le raisonnement de Mélanie.</p>\n<div class=\"dossier-table\">\n  <article class=\"dossier-piece piece-mail\"><div class=\"piece-top\"><span class=\"piece-icon\">✉</span><span class=\"piece-type\">Demande du service</span></div><h3>Fermeture temporaire</h3><p>Rue des Flamboyants<br>Samedi · 7 h → 18 h</p></article>\n  <article class=\"dossier-piece piece-map\"><div class=\"piece-top\"><span class=\"piece-icon\">⌖</span><span class=\"piece-type\">Plan</span></div><h3>Localisation</h3><p>Rue communale située dans l’agglomération.</p></article>\n  <article class=\"dossier-piece piece-law\"><div class=\"piece-top\"><span class=\"piece-icon\">§</span><span class=\"piece-type\">Extrait juridique fourni</span></div><h3>Pouvoir du maire</h3><p>Dans les situations prévues par le code des communes, le maire dispose d’un pouvoir de réglementation de la circulation.</p></article>\n</div>\n<div class=\"focus-question\"><span>À ce stade</span><strong>Quelle information sécurise réellement le fait que Mélanie peut avancer sur un arrêté du maire ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Le fait qu’un ancien arrêté existe déjà.", "Le fait qu’un texte permette d’établir le pouvoir du maire dans la situation étudiée.", "Le fait que la manifestation ait lieu samedi."], "correct": 1, "feedback": ["Un précédent ne crée aucune compétence.", "Exact. Mélanie commence par établir qu’une autorité dispose bien du pouvoir d’agir dans cette situation.", "La date sera utile pour le dispositif, mais ne répond pas à la question de compétence."]}}, {"eyebrow": "Dossier 1 · Commune", "title": "Regardez ce que fait réellement l’acte", "body": "\n<div class=\"decision-sheet\">\n  <div class=\"decision-sheet-head\"><span>Projet de mesure</span><strong>Circulation temporairement interdite</strong></div>\n  <div class=\"decision-street\" aria-hidden=\"true\"><div class=\"street-line\"></div><div class=\"road-sign\">⛔</div><div class=\"street-label\">Rue des Flamboyants</div><div class=\"time-badge\">Samedi · 7 h → 18 h</div></div>\n  <div class=\"decision-sheet-text\">La circulation de <strong>tous les véhicules</strong> sera interdite pendant la période prévue, sauf véhicules de secours.</div>\n</div>\n<div class=\"compare-question\"><div class=\"compare-label\">Pour qualifier l’acte, ne regardez pas son titre. Regardez son effet.</div><strong>La mesure vise-t-elle une personne identifiée ou une règle applicable à tous les usagers concernés ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Elle vise une personne précisément identifiée.", "Elle fixe une règle applicable à tous les usagers entrant dans la situation prévue."], "correct": 1, "feedback": ["Non. Aucune personne déterminée n’est individuellement visée.", "Exact. Dans ce cas pédagogique, la mesure a un caractère réglementaire."]}}, {"eyebrow": "Dossier 1 · Commune", "title": "Le piège se cache dans une petite mention", "body": "\n<div class=\"split-doc-scene\">\n  <div class=\"old-act\"><div class=\"old-act-ribbon\">Acte 2025</div><div class=\"old-act-lines\"><span></span><span></span><span></span><span></span></div><div class=\"old-act-footer\"><small>Mention en bas de page</small><strong>« Transmis au haut-commissaire le… »</strong></div></div>\n  <div class=\"colleague-bubble\"><small>Un collègue</small><strong>« Remets la même chose. Tous nos arrêtés sont transmis. »</strong></div>\n</div>\n<div class=\"risk-question\"><span class=\"risk-dot\"></span><div><small>Attention au réflexe automatique</small><strong>Quelle est la bonne conduite ?</strong></div></div>\n", "activity": {"type": "choice", "choices": ["Reprendre la mention puisqu’elle figurait sur l’ancien acte.", "Supprimer automatiquement la mention puisque les arrêtés municipaux ne sont jamais transmis.", "Vérifier si cette catégorie précise d’acte doit être transmise."], "correct": 2, "feedback": ["Une formalité ancienne doit, elle aussi, être vérifiée.", "Le raisonnement « jamais » serait aussi risqué que le raisonnement « toujours ».", "Exact. Le code énumère les actes soumis à transmission ; il faut donc vérifier la catégorie concernée au lieu de recopier la mention."]}}, {"eyebrow": "Dossier 1 · Commune", "title": "Après la signature, le dossier continue", "body": "\n<div class=\"post-signature\">\n  <div class=\"signature-stamp\"><span>✓</span><strong>Arrêté signé</strong></div>\n  <div class=\"post-arrow\" aria-hidden=\"true\">→</div>\n  <div class=\"post-question\"><small>Et maintenant ?</small><strong>Quelles actions restent à traiter pour le cas étudié ?</strong></div>\n</div>\n<div class=\"action-cards-intro\"><span>Sélectionnez ce qui reste pertinent</span><p>Vous pouvez choisir plusieurs réponses.</p></div>\n", "activity": {"type": "multi", "choices": ["Porter l’acte à la connaissance des personnes concernées selon les règles de publicité applicables.", "Le transmettre obligatoirement au haut-commissaire au titre de la catégorie étudiée.", "Vérifier les modalités pratiques de mise en œuvre sur le terrain."], "correct": [0, 2], "feedback": "Pour ce cas pédagogique : la publicité reste nécessaire ; la transmission obligatoire n’est pas requise au titre de la catégorie étudiée ; la mise en œuvre pratique doit aussi être préparée."}}, {"eyebrow": "Dossier 2 · Province", "title": "« Le dossier ne remplit pas les conditions »", "body": "\n<div class=\"case-opening province-case\">\n  <div class=\"case-person\">\n    <div class=\"case-photo-frame\"><img class=\"case-photo\" src=\"assets/03_lina_province.webp\" alt=\"Lina étudie les pièces d’un dossier avant de préparer une décision de refus.\"></div>\n    <div class=\"person-caption\"><span class=\"role-tag\">Gestionnaire provinciale</span><h3>Lina</h3><p>Elle instruit des demandes et prépare les projets de décision de son service.</p></div>\n  </div>\n  <div class=\"case-context province-context\">\n    <div class=\"case-label\">La situation</div>\n    <p>Une association demande l’autorisation d’utiliser un équipement provincial pour organiser une manifestation.</p>\n    <p>Après instruction, le service conclut que <strong>la demande ne remplit pas toutes les conditions prévues.</strong></p>\n  </div>\n</div>\n\n<div class=\"province-dossier-stack\" aria-hidden=\"true\">\n  <div class=\"stack-doc sd1\">Demande</div>\n  <div class=\"stack-doc sd2\">Règlement</div>\n  <div class=\"stack-doc sd3\">Fiche d’instruction</div>\n  <div class=\"stack-doc sd4\">Ancienne décision</div>\n</div>\n\n<div class=\"manager-request province-request\">\n  <span class=\"manager-mark\">↳</span>\n  <div><small>Consigne</small><strong>« La demande doit être refusée. Peux-tu préparer la décision ? »</strong></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Premier réflexe</span><strong>Par quoi Lina doit-elle commencer ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Reprendre l’ancienne décision et modifier le nom de l’association.", "Lire uniquement le règlement provincial.", "Identifier la règle applicable et les faits précis du dossier qui conduisent au refus."], "correct": 2, "feedback": ["Le modèle peut aider à structurer le document, mais pas à comprendre ce dossier précis.", "Le règlement est nécessaire, mais il faut aussi confronter la règle aux faits du dossier.", "Exact : règle applicable + faits utiles + raisonnement."]}}, {"eyebrow": "Dossier 2 · Province", "title": "Le bon texte dépend aussi de l’administration", "body": "\n<p class=\"lead compact-lead\">Une collègue conseille à Lina : <strong>« Pour la motivation, regarde directement dans le CRPA. »</strong></p>\n\n<div class=\"regime-compare\">\n  <div class=\"regime-card regime-state\">\n    <div class=\"regime-top\"><span class=\"regime-icon\">A</span><span>État / communes</span></div>\n    <h3>CRPA</h3>\n    <p>Le code des relations entre le public et l’administration constitue ici le corpus de référence, sous réserve des adaptations applicables en Nouvelle-Calédonie.</p>\n  </div>\n\n  <div class=\"regime-switch\" aria-hidden=\"true\">≠</div>\n\n  <div class=\"regime-card regime-local\">\n    <div class=\"regime-top\"><span class=\"regime-icon\">B</span><span>Nouvelle-Calédonie / provinces</span></div>\n    <h3>Droit localement applicable</h3>\n    <p>Pour la motivation, la loi du 11 juillet 1979 demeure notamment une référence applicable aux administrations de la Nouvelle-Calédonie et des provinces.</p>\n  </div>\n</div>\n\n<div class=\"regime-warning\">\n  <span>!</span>\n  <div><strong>Le piège :</strong> appliquer automatiquement le même corpus juridique à toutes les administrations publiques de Nouvelle-Calédonie.</div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Que fait Lina ?</span><strong>Quel est le bon réflexe ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Utiliser systématiquement le CRPA.", "Vérifier d’abord quel régime de motivation s’applique à l’administration provinciale.", "Ne rien vérifier : dès qu’il y a des considérants, la motivation est suffisante."], "correct": 1, "feedback": ["Le CRPA n’est pas ici le réflexe universel.", "Exact. Le premier contrôle porte sur le corpus applicable à l’administration qui prend la décision.", "La présence du mot « considérant » ne suffit pas à démontrer que la motivation est juridiquement utile."]}}, {"eyebrow": "Dossier 2 · Province", "title": "Refuser une autorisation : faut-il expliquer pourquoi ?", "body": "\n<div class=\"legal-extract-card\">\n  <div class=\"legal-extract-head\">\n    <span class=\"legal-symbol\">§</span>\n    <div><small>Ressource fournie à Lina</small><strong>Règle simplifiée</strong></div>\n  </div>\n  <div class=\"legal-extract-body\">\n    Certaines décisions administratives individuelles défavorables doivent être motivées.\n    <strong>Sont notamment concernées les décisions qui refusent une autorisation.</strong>\n  </div>\n</div>\n\n<div class=\"case-link\">\n  <span class=\"case-link-label\">Dans notre dossier</span>\n  <div class=\"case-link-line\"></div>\n  <strong>La province refuse précisément l’autorisation demandée par l’association.</strong>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Application</span><strong>La décision doit-elle être motivée ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Oui.", "Non, puisqu’un refus appartient au pouvoir de l’administration.", "Uniquement si l’association demande ensuite les motifs."], "correct": 0, "feedback": ["Oui. Dans la situation pédagogique proposée, la décision entre dans une catégorie pour laquelle la motivation est requise.", "Non. Dans le cas étudié, le refus ne dispense pas l’administration d’exposer ses motifs.", "Non. Ici, la motivation doit apparaître dans la décision elle-même."]}}, {"eyebrow": "Dossier 2 · Province", "title": "Des visas ne remplacent pas une motivation", "body": "\n<div class=\"act-analysis\">\n  <div class=\"act-paper\">\n    <div class=\"act-section act-visas\">\n      <span class=\"act-label\">Visas</span>\n      <p><strong>Vu</strong> le règlement provincial applicable ;</p>\n      <p><strong>Vu</strong> la demande déposée par l’association ;</p>\n    </div>\n    <div class=\"act-section act-motive\">\n      <span class=\"act-label\">Motivation</span>\n      <p><strong>Considérant</strong> qu’il y a lieu de refuser la demande ;</p>\n    </div>\n    <div class=\"act-section act-dispositif\">\n      <span class=\"act-label\">Décision</span>\n      <p><strong>Article 1</strong> — La demande est refusée.</p>\n    </div>\n  </div>\n\n  <div class=\"analysis-side\">\n    <div class=\"analysis-question\">Le document cite des textes et contient un « considérant ».</div>\n    <div class=\"analysis-question strongq\">Mais comprend-on réellement <em>pourquoi</em> la demande est refusée ?</div>\n  </div>\n</div>\n\n<div class=\"visa-vs-motif\">\n  <div><small>Un visa répond surtout à</small><strong>« Sur quelles références m’appuyé-je ? »</strong></div>\n  <span>≠</span>\n  <div><small>Une motivation répond à</small><strong>« Pourquoi cette décision dans ce dossier ? »</strong></div>\n</div>\n\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_04_visas_motivation.webp\" alt=\"Infographie comparant la fonction des visas et celle de la motivation.\"></div><div class=\"decision-prompt\"><span class=\"decision-label\">Diagnostic</span><strong>Quel est le principal problème ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Il n’y a pas assez de textes dans les visas.", "La décision ne permet pas réellement de comprendre pourquoi la demande est refusée.", "Le mot « Considérant » devrait être écrit en majuscules."], "correct": 1, "feedback": ["Ajouter des textes ne résoudrait pas le problème de raisonnement.", "Exact. « Il y a lieu de refuser » donne la conclusion, pas les raisons de droit et de fait.", "La typographie n’est pas le problème ici."]}}, {"eyebrow": "Dossier 2 · Province", "title": "Construisez le raisonnement : règle → faits → décision", "body": "\n<div class=\"reasoning-flow\">\n  <div class=\"reason-node rule-node\">\n    <span class=\"reason-kicker\">1 · Règle</span>\n    <strong>Le règlement fictif exige notamment une attestation d’assurance.</strong>\n  </div>\n  <div class=\"reason-arrow\" aria-hidden=\"true\">+</div>\n  <div class=\"reason-node fact-node\">\n    <span class=\"reason-kicker\">2 · Faits</span>\n    <strong>Le dossier contient plusieurs informations. Toutes ne sont pas utiles.</strong>\n  </div>\n  <div class=\"reason-arrow\" aria-hidden=\"true\">→</div>\n  <div class=\"reason-node decision-node\">\n    <span class=\"reason-kicker\">3 · Décision</span>\n    <strong>La condition n’est pas remplie : l’autorisation peut être refusée sur ce fondement.</strong>\n  </div>\n</div>\n\n<div class=\"fact-file\">\n  <div class=\"fact-file-head\"><span>Pièces du dossier</span><strong>Quels faits sont réellement déterminants ?</strong></div>\n  <div class=\"fact-mini-grid\">\n    <span>Attestation d’assurance non fournie malgré relance</span>\n    <span>Dispositif de sécurité transmis</span>\n    <span>Président de l’association en fonction depuis 6 ans</span>\n    <span>Identité du responsable transmise</span>\n  </div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Sélection multiple</span><strong>Quels éléments sont utiles pour expliquer juridiquement le refus ?</strong></div>\n", "activity": {"type": "multi", "choices": ["La règle exigeant l’attestation d’assurance.", "L’absence de cette attestation malgré la demande de complément.", "L’ancienneté du président de l’association.", "Le fait que le dispositif de sécurité a été transmis."], "correct": [0, 1], "feedback": "Une motivation utile retient la règle pertinente et les faits déterminants. Les informations sans lien avec la condition manquante n’ont pas à encombrer le raisonnement."}}, {"eyebrow": "Dossier 2 · Province", "title": "Même décision. Deux niveaux de qualité très différents.", "body": "\n<div class=\"before-after-motive\">\n  <div class=\"motive-version weak-version\">\n    <div class=\"motive-badge\">Avant</div>\n    <span class=\"motive-status\">Insuffisant pour comprendre</span>\n    <blockquote>« Considérant qu’il y a lieu de rejeter la demande. »</blockquote>\n    <p>Le lecteur connaît la conclusion, mais pas le raisonnement.</p>\n  </div>\n\n  <div class=\"motive-divider\" aria-hidden=\"true\">→</div>\n\n  <div class=\"motive-version strong-version\">\n    <div class=\"motive-badge\">Après</div>\n    <span class=\"motive-status\">Raisonnement visible</span>\n    <div class=\"motive-steps\">\n      <div><span>Règle</span><p>L’attestation d’assurance est requise.</p></div>\n      <div><span>Fait</span><p>Elle n’a pas été produite malgré la demande de complément.</p></div>\n      <div><span>Conséquence</span><p>La condition n’est donc pas remplie.</p></div>\n    </div>\n  </div>\n</div>\n\n<div class=\"reader-test\">\n  <div class=\"reader-icon\" aria-hidden=\"true\">👁</div>\n  <div>\n    <small>Le test du lecteur extérieur</small>\n    <strong>Une personne qui ne connaît pas le dossier peut-elle comprendre quelle règle a été appliquée et quels faits ont conduit à la décision ?</strong>\n  </div>\n</div>\n\n<div class=\"key-sentence province-key\">\n  <span class=\"key-mark\">✓</span>\n  <div><strong>À retenir :</strong> lorsque la motivation est requise, l’acte doit faire apparaître les considérations pertinentes de droit et de fait.</div>\n</div>\n"}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "« Il nous faut maintenant l’arrêté d’application »", "body": "\n<div class=\"case-opening nc-case\">\n  <div class=\"case-person\">\n    <div class=\"case-photo-frame\"><img class=\"case-photo\" src=\"assets/04_thomas_nc.webp\" alt=\"Thomas suit les différentes étapes d’un acte administratif et contrôle son circuit.\"></div>\n    <div class=\"person-caption\"><span class=\"role-tag\">Chargé de mission</span><h3>Thomas</h3><p>Il prépare un projet d’arrêté pour un service de la Nouvelle-Calédonie.</p></div>\n  </div>\n  <div class=\"case-context nc-context\">\n    <div class=\"case-label\">La situation</div>\n    <p>Le congrès vient d’adopter une délibération créant un nouveau dispositif administratif.</p>\n    <p>Cette délibération prévoit que certaines modalités seront précisées par <strong>arrêté du gouvernement.</strong></p>\n  </div>\n</div>\n\n<div class=\"nc-source-chain\" aria-hidden=\"true\">\n  <div class=\"chain-doc congress-doc\">\n    <span>Délibération du congrès</span>\n    <strong>Le cadre</strong>\n  </div>\n  <div class=\"chain-arrow\">→</div>\n  <div class=\"chain-doc gov-doc\">\n    <span>Arrêté du gouvernement</span>\n    <strong>La mise en œuvre</strong>\n  </div>\n</div>\n\n<div class=\"manager-request nc-request\">\n  <span class=\"manager-mark\">↳</span>\n  <div><small>Consigne</small><strong>« Tu peux reprendre l’arrêté utilisé pour un dispositif similaire. »</strong></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Avant le modèle</span><strong>Quelle vérification Thomas doit-il faire en premier ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Vérifier seulement que l’ancien arrêté a été publié au JONC.", "Vérifier que le gouvernement peut prendre l’arrêté envisagé et identifier le fondement de ce pouvoir.", "Vérifier seulement que le titre ressemble à celui de l’ancien arrêté."], "correct": 1, "feedback": ["La publication de l’ancien acte ne prouve pas que le nouvel acte repose sur le bon fondement.", "Exact. La première question est : « Pourquoi le gouvernement peut-il agir ici ? »", "Le titre d’un document ne crée aucune compétence."]}}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "Retrouvez le passage qui autorise le gouvernement à agir", "body": "\n<div class=\"habilitation-board\">\n  <div class=\"habilitation-source\">\n    <div class=\"hb-head\"><span class=\"hb-num\">1</span><div><small>Loi organique — règle simplifiée</small><strong>Le principe</strong></div></div>\n    <p>Le gouvernement prépare et exécute les délibérations du congrès et prend, <strong>sur habilitation</strong>, les arrêtés nécessaires à leur mise en œuvre.</p>\n  </div>\n\n  <div class=\"habilitation-link\" aria-hidden=\"true\">\n    <span></span><strong>Je cherche le lien</strong><span></span>\n  </div>\n\n  <div class=\"habilitation-target\">\n    <div class=\"hb-head\"><span class=\"hb-num\">2</span><div><small>Délibération fictive</small><strong>Article 18</strong></div></div>\n    <blockquote>« Les conditions d’application relatives à la procédure d’instruction et aux pièces justificatives sont précisées par arrêté du gouvernement. »</blockquote>\n  </div>\n</div>\n\n<div class=\"habilitation-result\">\n  <span class=\"result-key\">✓</span>\n  <div><small>Ce que Thomas doit pouvoir établir</small><strong>Le gouvernement n’intervient pas « parce qu’un arrêté est pratique » : il intervient ici parce que la délibération lui confie précisément cette mise en œuvre.</strong></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Repérage</span><strong>Quel élément permet au gouvernement d’intervenir dans ce dossier ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Le service estime qu’un arrêté serait utile.", "L’article 18 de la délibération habilite le gouvernement à préciser les modalités concernées.", "Un arrêté similaire a déjà existé."], "correct": 1, "feedback": ["L’utilité administrative ne crée pas un pouvoir juridique.", "Exact. Thomas a identifié l’habilitation qui fonde l’intervention du gouvernement dans ce dossier.", "Un précédent n’est pas un fondement juridique."]}}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "Une habilitation donne un cadre. Elle a aussi des limites.", "body": "\n<div class=\"scope-frame\">\n  <div class=\"scope-head\">\n    <span class=\"scope-label\">Ce que la délibération permet de préciser</span>\n    <strong>Le périmètre de l’arrêté d’application</strong>\n  </div>\n  <div class=\"scope-inside\">\n    <span>Procédure d’instruction</span>\n    <span>Pièces justificatives</span>\n    <span>Délais de dépôt</span>\n  </div>\n</div>\n\n<div class=\"scope-outside\">\n  <div class=\"outside-mark\">+</div>\n  <div>\n    <small>Thomas envisage d’ajouter</small>\n    <strong>« Toute demande tardive donnera lieu à une pénalité administrative de 50 000 F CFP. »</strong>\n  </div>\n</div>\n\n<div class=\"scope-alert\">\n  <span>?</span>\n  <div><strong>La question n’est pas : « Est-ce utile ? »</strong><p>La question est : « Le gouvernement dispose-t-il réellement d’un fondement lui permettant de créer cette sanction ? »</p></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Limite du pouvoir d’agir</span><strong>Que doit faire Thomas ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Ajouter la sanction puisque le gouvernement prend l’arrêté d’application.", "Ajouter la sanction si elle semble utile au dispositif.", "S’arrêter et vérifier s’il existe un fondement permettant réellement de créer cette sanction."], "correct": 2, "feedback": ["Un arrêté d’application n’est pas un blanc-seing.", "L’utilité d’une mesure ne suffit pas à établir la compétence pour la créer.", "Exact. Doute sur l’étendue de la compétence = point à sécuriser avant de rédiger."]}}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "Le projet paraît parfait… mais regardez tout en bas", "body": "\n<div class=\"perfect-act-layout\">\n  <div class=\"perfect-checks\">\n    <div class=\"perfect-title\">Le projet de Thomas</div>\n    <div class=\"perfect-item\"><span>✓</span> Titre précis</div>\n    <div class=\"perfect-item\"><span>✓</span> Visas actualisés</div>\n    <div class=\"perfect-item\"><span>✓</span> Habilitation identifiée</div>\n    <div class=\"perfect-item\"><span>✓</span> Motivation cohérente</div>\n    <div class=\"perfect-item\"><span>✓</span> Dispositif clair</div>\n  </div>\n\n  <div class=\"signature-paper\">\n    <div class=\"sig-lines\"><span></span><span></span><span></span></div>\n    <div class=\"sig-zone\">\n      <small>Signature prévue</small>\n      <strong>Le président du gouvernement</strong>\n      <em>[signature]</em>\n    </div>\n  </div>\n</div>\n\n<div class=\"magnifier-note\">\n  <span class=\"magnifier\" aria-hidden=\"true\">⌕</span>\n  <div><small>Dernier contrôle</small><strong>Le contenu est bien rédigé. Mais le circuit de signature est-il complet ?</strong></div>\n</div>\n\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_05_competence_signature.webp\" alt=\"Infographie distinguant compétence, délégation de signature et contreseing.\"><div class=\"pedago-info-caption\">Trois contrôles différents : pouvoir de décider, pouvoir de signer, éventuelle seconde signature requise.</div></div><div class=\"decision-prompt\"><span class=\"decision-label\">Avant transmission</span><strong>Quel point Thomas doit-il encore vérifier ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Aucun : le président signe les actes du gouvernement.", "Les règles particulières de signature et de contreseing applicables aux arrêtés du gouvernement.", "Uniquement la police de caractères utilisée."], "correct": 1, "feedback": ["Pour un arrêté du gouvernement, le contrôle ne s’arrête pas à la signature du président.", "Exact. La loi organique prévoit une règle particulière de signature et de contreseing.", "La typographie n’est pas l’enjeu juridique de cet écran."]}}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "Deux interventions à prévoir sur l’arrêté", "body": "\n<div class=\"signature-system\">\n  <div class=\"sign-card president-card\">\n    <div class=\"sign-role\">Signature</div>\n    <div class=\"sign-avatar\">P</div>\n    <h3>Président du gouvernement</h3>\n    <p>Il signe l’arrêté.</p>\n    <div class=\"signature-line\"></div>\n  </div>\n\n  <div class=\"signature-plus\" aria-hidden=\"true\">+</div>\n\n  <div class=\"sign-card member-card\">\n    <div class=\"sign-role\">Contreseing</div>\n    <div class=\"sign-avatar\">M</div>\n    <h3>Membre chargé du secteur concerné</h3>\n    <p>Il contresigne l’arrêté lorsqu’il est chargé d’en contrôler l’exécution.</p>\n    <div class=\"signature-line\"></div>\n  </div>\n</div>\n\n<div class=\"signature-rule\">\n  <span class=\"legal-symbol\">§</span>\n  <div><small>Règle à utiliser, pas à apprendre par cœur</small><strong>Les arrêtés du gouvernement sont signés par le président et contresignés par les membres du gouvernement chargés d’en contrôler l’exécution.</strong></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Dans le dossier de Thomas</span><strong>Quels emplacements faut-il prévoir ?</strong></div>\n", "activity": {"type": "multi", "choices": ["Signature du président du gouvernement.", "Contreseing du membre du gouvernement chargé du secteur concerné.", "Signature obligatoire du haut-commissaire."], "correct": [0, 1], "feedback": "Pour l’arrêté étudié : signature du président + contreseing du membre chargé d’en contrôler l’exécution. Le haut-commissaire n’est pas un signataire de l’arrêté."}}, {"eyebrow": "Dossier 3 · Nouvelle-Calédonie", "title": "Signé ne veut pas encore dire exécutoire", "body": "\n<p class=\"lead compact-lead\">Thomas vient d’obtenir l’arrêté signé. Son tableau de suivi affiche déjà <strong>« Terminé »</strong>.</p>\n\n<div class=\"lifecycle\">\n  <div class=\"life-step done-step\">\n    <span class=\"life-num\">1</span>\n    <small>Décision</small>\n    <strong>Adopté</strong>\n  </div>\n  <div class=\"life-arrow\">→</div>\n  <div class=\"life-step done-step\">\n    <span class=\"life-num\">2</span>\n    <small>Formalisation</small>\n    <strong>Signé</strong>\n  </div>\n  <div class=\"life-arrow\">→</div>\n  <div class=\"life-step pending-step\">\n    <span class=\"life-num\">3</span>\n    <small>Selon la nature de l’acte</small>\n    <strong>Publié au JONC ou notifié</strong>\n  </div>\n  <div class=\"life-arrow\">+</div>\n  <div class=\"life-step pending-step\">\n    <span class=\"life-num\">4</span>\n    <small>Actes concernés</small>\n    <strong>Transmis au haut-commissaire</strong>\n  </div>\n  <div class=\"life-arrow\">→</div>\n  <div class=\"life-step final-step\">\n    <span class=\"life-num\">5</span>\n    <small>Lorsque les conditions sont réunies</small>\n    <strong>Exécutoire</strong>\n  </div>\n</div>\n\n<div class=\"lifecycle-note\">\n  <span>!</span>\n  <div><strong>Pour les arrêtés réglementaires ou individuels du gouvernement visés par l’article 204 :</strong><p>le caractère exécutoire suppose l’accomplissement des formalités prévues. Pour les décisions individuelles concernées, la transmission intervient dans les quinze jours suivant la signature.</p></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Dernier réflexe du dossier</span><strong>À la seule lecture de « signé », Thomas peut-il considérer son travail terminé ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Oui, la signature suffit.", "Oui, dès lors que le gouvernement a adopté le texte.", "Non. Il faut encore vérifier et accomplir les formalités nécessaires pour rendre l’acte exécutoire."], "correct": 2, "feedback": ["La signature est une étape, pas nécessairement la dernière.", "L’adoption ne suffit pas à elle seule.", "Exact. Le cycle de vie de l’acte continue après la signature."]}}, {"eyebrow": "Dossier 4 · Établissement public", "title": "« Prépare-moi une décision, je la signerai »", "body": "\n<div class=\"case-opening ep-case\">\n  <div class=\"case-person\">\n    <div class=\"case-photo-frame\"><img class=\"case-photo\" src=\"assets/05_noemie_ep.webp\" alt=\"Noémie compare plusieurs documents pour déterminer l’autorité compétente.\"></div>\n    <div class=\"person-caption\"><span class=\"role-tag\">Gestionnaire administrative</span><h3>Noémie</h3><p>Elle travaille dans un établissement public fictif de la Nouvelle-Calédonie.</p></div>\n  </div>\n  <div class=\"case-context ep-context\">\n    <div class=\"case-label\">La situation</div>\n    <p>Une association partenaire demande à utiliser gratuitement une salle de l’établissement pendant <strong>trois mois</strong>.</p>\n    <p>Le directeur estime que la demande peut être acceptée.</p>\n  </div>\n</div>\n\n<div class=\"manager-request ep-request\">\n  <span class=\"manager-mark\">↳</span>\n  <div><small>Message du directeur</small><strong>« Prépare-moi la décision, je la signerai. »</strong></div>\n</div>\n\n<div class=\"authority-trap\">\n  <div class=\"trap-left\">\n    <small>Ce que Noémie sait</small>\n    <strong>Le directeur signe régulièrement des décisions.</strong>\n  </div>\n  <div class=\"trap-symbol\" aria-hidden=\"true\">≠</div>\n  <div class=\"trap-right\">\n    <small>Ce qu’elle ne sait pas encore</small>\n    <strong>S’il est compétent pour cette décision précise.</strong>\n  </div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Premier réflexe</span><strong>Le fait que le directeur signe souvent des actes suffit-il ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Oui, puisqu’il dirige l’établissement.", "Oui, si les anciennes décisions sont bien présentées.", "Non. Il faut vérifier quel organe est compétent et ce que prévoient les textes propres à l’établissement."], "correct": 2, "feedback": ["La qualité de directeur ne permet pas de déduire toutes ses compétences.", "La présentation d’un ancien acte ne prouve aucune compétence.", "Exact. Avant de rédiger, Noémie doit identifier le texte qui répartit les pouvoirs dans l’établissement."]}}, {"eyebrow": "Dossier 4 · Établissement public", "title": "Cherchez la règle de gouvernance avant le modèle Word", "body": "\n<p class=\"lead compact-lead\">Noémie dispose de quatre ressources. Elles n’ont pas toutes la même valeur pour répondre à la question : <strong>« Qui peut décider ? »</strong></p>\n\n<div class=\"resource-shelf\">\n  <article class=\"resource-card low-resource\">\n    <span class=\"resource-letter\">A</span>\n    <div class=\"resource-icon\">▤</div>\n    <h3>Règlement intérieur des salles</h3>\n    <p>Il précise les conditions d’utilisation.</p>\n  </article>\n\n  <article class=\"resource-card key-resource\">\n    <span class=\"resource-letter\">B</span>\n    <div class=\"resource-icon\">§</div>\n    <h3>Statut de l’établissement</h3>\n    <p>Il répartit les compétences entre les organes.</p>\n  </article>\n\n  <article class=\"resource-card low-resource\">\n    <span class=\"resource-letter\">C</span>\n    <div class=\"resource-icon\">↺</div>\n    <h3>Ancienne décision</h3>\n    <p>Elle montre une pratique passée.</p>\n  </article>\n\n  <article class=\"resource-card low-resource\">\n    <span class=\"resource-letter\">D</span>\n    <div class=\"resource-icon\">W</div>\n    <h3>Modèle Word</h3>\n    <p>Il aide à la mise en forme.</p>\n  </article>\n</div>\n\n<div class=\"statut-repere\">\n  <span class=\"legal-symbol\">§</span>\n  <div>\n    <small>Repère juridique</small>\n    <strong>Pour les établissements publics administratifs de la Nouvelle-Calédonie et des provinces, la loi organique renvoie au statut de chaque établissement pour l’exécution des délibérations du conseil d’administration.</strong>\n  </div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Priorité</span><strong>Quel document Noémie consulte-t-elle d’abord pour rechercher l’autorité compétente ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Le règlement intérieur.", "Le statut de l’établissement.", "L’ancienne décision.", "Le modèle Word."], "correct": 1, "feedback": ["Le règlement peut préciser les conditions d’usage, mais pas nécessairement la répartition des pouvoirs.", "Exact. Le statut est la première ressource pour comprendre qui décide quoi dans cet établissement fictif.", "Un précédent ne démontre pas une compétence actuelle.", "Un modèle Word n’a aucune valeur pour déterminer l’autorité compétente."]}}, {"eyebrow": "Dossier 4 · Établissement public", "title": "Une délégation doit couvrir exactement la décision à prendre", "body": "\n<div class=\"competence-compare\">\n  <div class=\"competence-box statut-box\">\n    <div class=\"competence-head\"><span>Statut fictif</span><strong>Qui décide normalement ?</strong></div>\n    <div class=\"competence-rule\">\n      <span class=\"cr-label\">Conseil d’administration</span>\n      <p>Décide des mises à disposition gratuites d’une durée <strong>supérieure à un mois</strong>.</p>\n    </div>\n  </div>\n\n  <div class=\"competence-box delegation-box\">\n    <div class=\"competence-head\"><span>Délégation fictive</span><strong>Ce que le directeur peut décider seul</strong></div>\n    <div class=\"competence-rule\">\n      <span class=\"cr-label\">Directeur</span>\n      <p>Mises à disposition ponctuelles d’une durée maximale de <strong>deux jours</strong>.</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"request-meter\">\n  <div class=\"meter-label\"><small>Demande réelle</small><strong>3 mois</strong></div>\n  <div class=\"meter-track\">\n    <div class=\"meter-range delegation-range\"><span>≤ 2 jours</span></div>\n    <div class=\"meter-gap\"></div>\n    <div class=\"meter-target\"><span>3 mois</span></div>\n  </div>\n</div>\n\n<div class=\"gap-alert\">\n  <span class=\"gap-icon\">!</span>\n  <div><strong>Une délégation existe, mais elle ne suffit pas.</strong><p>Il faut lire son périmètre : bénéficiaire, matière, durée, limites et période de validité.</p></div>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Lecture de la délégation</span><strong>Le directeur peut-il signer la décision sur ce seul fondement ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Oui, puisqu’une délégation existe.", "Non, la délégation fournie ne couvre pas la durée envisagée.", "Oui, puisque trois mois restent une durée temporaire."], "correct": 1, "feedback": ["L’existence d’une délégation ne suffit jamais à elle seule.", "Exact. La délégation doit couvrir la décision précise à prendre ; ici, deux jours et trois mois ne correspondent pas.", "Le caractère temporaire ne permet pas d’ignorer la limite fixée dans la délégation."]}}, {"eyebrow": "Dossier 4 · Établissement public", "title": "Savoir s’arrêter fait partie du travail", "body": "\n<div class=\"stop-scenario\">\n  <div class=\"stop-bubble\">\n    <small>Le responsable</small>\n    <strong>« Ce n’est pas grave. Fais quand même la décision, nous verrons après. »</strong>\n  </div>\n\n  <div class=\"stop-sign\" aria-hidden=\"true\">\n    <span>STOP</span>\n  </div>\n\n  <div class=\"stop-reason\">\n    <small>Ce qui manque encore</small>\n    <strong>Un fondement établissant que le directeur peut décider seul pour trois mois.</strong>\n  </div>\n</div>\n\n<div class=\"three-step-alert\">\n  <div class=\"alert-step\">\n    <span>1</span>\n    <strong>Je formule le doute</strong>\n    <p>Quelle autorité est compétente pour cette durée ?</p>\n  </div>\n  <div class=\"alert-step\">\n    <span>2</span>\n    <strong>Je joins les éléments utiles</strong>\n    <p>Statut, délégation, demande de l’association.</p>\n  </div>\n  <div class=\"alert-step\">\n    <span>3</span>\n    <strong>Je demande une validation ciblée</strong>\n    <p>Je ne transmets pas une question vague du type « mon acte est-il bon ? »</p>\n  </div>\n</div>\n\n<div class=\"good-question\">\n  <small>Une demande de validation utile</small>\n  <blockquote>« Le statut attribue au conseil d’administration les mises à disposition dépassant un mois. La délégation au directeur est limitée à deux jours. La demande porte sur trois mois. Pouvez-vous confirmer l’autorité et la procédure à retenir avant que je finalise le projet ? »</blockquote>\n</div>\n\n<div class=\"decision-prompt\"><span class=\"decision-label\">Posture professionnelle</span><strong>Que doit faire Noémie ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Préparer l’acte comme si le directeur était compétent.", "Modifier artificiellement la durée pour entrer dans la délégation.", "Signaler le point de compétence et faire déterminer l’autorité ou la procédure appropriée avant de finaliser."], "correct": 2, "feedback": ["Cela reviendrait à ignorer un risque déjà identifié.", "On n’adapte jamais les faits pour les faire entrer artificiellement dans une délégation.", "Exact. Repérer précisément le doute et demander la validation adaptée fait partie de l’autonomie professionnelle."]}}, {"eyebrow": "Synthèse", "title": "Quatre dossiers. Une seule méthode.", "body": "\n<div class=\"four-cases-summary\">\n  <article class=\"summary-case sc-commune\">\n    <span class=\"summary-initial\">M</span>\n    <div><small>Commune</small><strong>Ne pas recopier une formalité sans la vérifier.</strong></div>\n  </article>\n  <article class=\"summary-case sc-province\">\n    <span class=\"summary-initial\">L</span>\n    <div><small>Province</small><strong>Distinguer les références de la véritable motivation.</strong></div>\n  </article>\n  <article class=\"summary-case sc-nc\">\n    <span class=\"summary-initial\">T</span>\n    <div><small>Nouvelle-Calédonie</small><strong>Vérifier le pouvoir d’agir, les signatures et l’après-signature.</strong></div>\n  </article>\n  <article class=\"summary-case sc-ep\">\n    <span class=\"summary-initial\">N</span>\n    <div><small>Établissement public</small><strong>Lire le statut et savoir s’arrêter quand le fondement manque.</strong></div>\n  </article>\n</div>\n\n<div class=\"method-3times\">\n  <section class=\"method-time mt-before\">\n    <div class=\"mt-head\"><span>01</span><div><small>Avant</small><strong>Je cadre</strong></div></div>\n    <ul>\n      <li>Que veut-on décider ?</li>\n      <li>Quelle administration est compétente ?</li>\n      <li>Quelle autorité peut décider ?</li>\n      <li>Quel type d’acte ?</li>\n      <li>Quelle procédure ?</li>\n      <li>Quels textes ?</li>\n    </ul>\n  </section>\n\n  <section class=\"method-time mt-during\">\n    <div class=\"mt-head\"><span>02</span><div><small>Pendant</small><strong>Je construis</strong></div></div>\n    <ul>\n      <li>Quels éléments de droit ?</li>\n      <li>Quels faits utiles ?</li>\n      <li>Quel dispositif précis ?</li>\n    </ul>\n  </section>\n\n  <section class=\"method-time mt-after\">\n    <div class=\"mt-head\"><span>03</span><div><small>Avant transmission / après signature</small><strong>Je sécurise</strong></div></div>\n    <ul>\n      <li>Qui signe ?</li>\n      <li>Quelle délégation ?</li>\n      <li>Faut-il un contreseing ?</li>\n      <li>Publication, notification, transmission ?</li>\n    </ul>\n  </section>\n</div>\n\n<div class=\"remember-band final-method-band\">\n  <span class=\"remember-eye\">◎</span>\n  <div><strong>Votre repère :</strong> vous n’avez pas neuf règles à mémoriser. Vous avez une méthode en trois temps à réutiliser sur vos propres dossiers.</div>\n</div>\n"}, {"eyebrow": "Contrôle final", "title": "Relecture finale : ce projet peut-il réellement partir en signature ?", "body": "<div class=\"relecture-brief\">\n  <span class=\"relecture-time\">5 min</span>\n  <div><small>Vous êtes le dernier relecteur avant transmission</small><strong>Ne cherchez pas des fautes de forme. Cherchez ce qui pourrait empêcher la décision d’être juridiquement ou opérationnellement sûre.</strong></div>\n</div>\n<div class=\"synthesis-master-wrap\">\n  <img class=\"master-visual synthesis-master\" src=\"assets/06_synthese.webp\"\n       alt=\"Document administratif examiné avec une loupe et plusieurs repères colorés signalant des points à vérifier.\">\n</div>\n\n<div class=\"fake-good-layout\">\n  <div class=\"fake-act\">\n    <div class=\"fake-act-head\">\n      <small>Projet fictif</small>\n      <strong>DÉCISION PORTANT AUTORISATION D’UTILISATION D’UN ÉQUIPEMENT PUBLIC</strong>\n    </div>\n\n    <div class=\"fake-zone\" data-zone=\"fondement\">\n      <span class=\"zone-tag\">Fondements</span>\n      <p><strong>Vu</strong> le texte portant création de l’établissement ;</p>\n      <p><strong>Vu</strong> le règlement relatif à l’utilisation des équipements ;</p>\n      <p><strong>Vu</strong> la demande de l’association Horizon ;</p>\n    </div>\n\n    <div class=\"fake-zone\" data-zone=\"motivation\">\n      <span class=\"zone-tag\">Motivation</span>\n      <p><strong>Considérant</strong> qu’il convient de faire droit à cette demande ;</p>\n    </div>\n\n    <div class=\"fake-zone\" data-zone=\"dates\">\n      <span class=\"zone-tag\">Article 1</span>\n      <p>L’association Horizon est autorisée à utiliser la salle du <strong>1er octobre au 30 septembre de la même année</strong>.</p>\n    </div>\n\n    <div class=\"fake-zone\">\n      <span class=\"zone-tag\">Article 2</span>\n      <p>L’association respecte le règlement intérieur applicable.</p>\n    </div>\n\n    <div class=\"fake-zone\" data-zone=\"formalites\">\n      <span class=\"zone-tag\">Article 3</span>\n      <p>La présente décision sera <strong>publiée et transmise conformément aux règles applicables.</strong></p>\n    </div>\n\n    <div class=\"fake-sign\" data-zone=\"signature\">\n      <small>Signature</small>\n      <strong>Le directeur adjoint</strong>\n      <em>Pour le directeur et par délégation</em>\n    </div>\n  </div>\n\n  <div class=\"case-docs\">\n    <div class=\"case-docs-title\"><small>Pièces disponibles</small><strong>Ce que vous savez réellement</strong></div>\n    <div class=\"case-doc\"><span>Statut</span><p>Au-delà d’un mois, la mise à disposition relève du conseil d’administration.</p></div>\n    <div class=\"case-doc\"><span>Délégation</span><p>Le directeur adjoint dispose d’une délégation pour les achats, missions et actes RH courants.</p></div>\n    <div class=\"case-doc\"><span>Demande</span><p>L’association sollicite une utilisation pendant trois mois.</p></div>\n  </div>\n</div>\n\n<div class=\"final-check-prompt\">\n  <span>Contrôle complet</span>\n  <strong>Sélectionnez tous les points qui méritent une vérification ou une correction avant transmission.</strong>\n</div>\n", "activity": {"type": "hotspots", "choices": ["Compétence de l’autorité pour une mise à disposition de trois mois.", "Périmètre réel de la délégation du directeur adjoint.", "Cohérence des dates de l’autorisation.", "Qualité de la motivation.", "Formalités après signature réellement applicables.", "Fondement juridique précis de la compétence."], "correct": [0, 1, 2, 3, 4, 5], "feedback": "Les six points méritent d’être contrôlés. Le document a tous les codes d’un acte administratif, mais son apparence ne sécurise ni la compétence, ni la délégation, ni les dates, ni la motivation, ni les formalités."}}, {"eyebrow": "Posture professionnelle", "title": "Je contrôle, je vérifie ou je fais valider ?", "body": "\n<p class=\"lead compact-lead\">L’autonomie ne consiste pas à tout résoudre seul. Elle consiste à <strong>savoir jusqu’où aller et quand demander une expertise ciblée.</strong></p>\n\n<div class=\"autonomy-zones\">\n  <section class=\"auto-zone zone-green\">\n    <div class=\"zone-head\"><span>✓</span><div><small>Je peux contrôler</small><strong>Contrôles de premier niveau</strong></div></div>\n    <ul>\n      <li>texte toujours en vigueur ;</li>\n      <li>cohérence des dates et montants ;</li>\n      <li>identité du signataire ;</li>\n      <li>correspondance entre faits et dispositif ;</li>\n      <li>périmètre apparent d’une délégation fournie.</li>\n    </ul>\n  </section>\n\n  <section class=\"auto-zone zone-orange\">\n    <div class=\"zone-head\"><span>↺</span><div><small>Je vérifie localement</small><strong>Règles propres à mon administration</strong></div></div>\n    <ul>\n      <li>circuit de validation ;</li>\n      <li>modalités pratiques de publication ;</li>\n      <li>outil de transmission ;</li>\n      <li>modèles internes ;</li>\n      <li>procédure d’archivage.</li>\n    </ul>\n  </section>\n\n  <section class=\"auto-zone zone-red\">\n    <div class=\"zone-head\"><span>!</span><div><small>Je fais valider</small><strong>Doute juridique significatif</strong></div></div>\n    <ul>\n      <li>compétence incertaine ;</li>\n      <li>textes contradictoires ;</li>\n      <li>sanction sans fondement clair ;</li>\n      <li>procédure sectorielle complexe ;</li>\n      <li>situation contentieuse ou atypique.</li>\n    </ul>\n  </section>\n</div>\n\n<div class=\"pedago-info-wrap\"><img class=\"pedago-info\" src=\"assets/info_06_autonomie.webp\" alt=\"Infographie distinguant contrôles de premier niveau, vérifications internes et validation juridique.\"></div><div class=\"decision-prompt\"><span class=\"decision-label\">Situation</span><strong>Deux textes semblent donner des réponses différentes sur l’autorité compétente. Que faites-vous ?</strong></div>\n", "activity": {"type": "choice", "choices": ["Je choisis automatiquement le texte le plus récent.", "Je prends le texte utilisé dans l’ancien modèle.", "J’identifie précisément la contradiction et je demande une validation avant de poursuivre."], "correct": 2, "feedback": ["La date peut être un indice, mais elle ne suffit pas toujours à résoudre l’articulation entre plusieurs textes.", "Un ancien modèle ne permet pas de résoudre une contradiction juridique.", "Exact. Vous avez identifié le point précis qui nécessite une expertise complémentaire."]}}, {"eyebrow": "Votre outil de travail", "title": "Mon acte est-il prêt ?", "body": "\n<div class=\"checklist-sheet\">\n  <div class=\"checklist-head\">\n    <div>\n      <small>Checklist professionnelle</small>\n      <strong>Avant de transmettre mon projet</strong>\n    </div>\n    <span class=\"checklist-mark\">✓</span>\n  </div>\n\n  <div class=\"checklist-grid\">\n    <section class=\"check-block cb-before\">\n      <div class=\"cb-title\"><span>01</span><strong>Avant de rédiger</strong></div>\n      <label><input type=\"checkbox\"> Je peux expliquer ce que l’administration veut décider.</label>\n      <label><input type=\"checkbox\"> J’ai vérifié la compétence de l’administration.</label>\n      <label><input type=\"checkbox\"> J’ai identifié l’autorité compétente.</label>\n      <label><input type=\"checkbox\"> J’ai identifié la nature de l’acte et les procédures préalables.</label>\n    </section>\n\n    <section class=\"check-block cb-during\">\n      <div class=\"cb-title\"><span>02</span><strong>Pendant la rédaction</strong></div>\n      <label><input type=\"checkbox\"> Mes textes sont applicables et à jour.</label>\n      <label><input type=\"checkbox\"> Je sais pourquoi ils sont utilisés.</label>\n      <label><input type=\"checkbox\"> La motivation est présente si elle est nécessaire.</label>\n      <label><input type=\"checkbox\"> Le dispositif correspond exactement à la décision attendue.</label>\n    </section>\n\n    <section class=\"check-block cb-sign\">\n      <div class=\"cb-title\"><span>03</span><strong>Avant signature</strong></div>\n      <label><input type=\"checkbox\"> J’ai identifié la bonne personne pour signer.</label>\n      <label><input type=\"checkbox\"> La délégation éventuelle est valide et adaptée.</label>\n      <label><input type=\"checkbox\"> J’ai vérifié l’éventuel contreseing.</label>\n    </section>\n\n    <section class=\"check-block cb-after\">\n      <div class=\"cb-title\"><span>04</span><strong>Après signature</strong></div>\n      <label><input type=\"checkbox\"> Je sais si l’acte doit être notifié ou publié.</label>\n      <label><input type=\"checkbox\"> Je sais s’il doit être transmis.</label>\n      <label><input type=\"checkbox\"> Je sais à quel moment il devient exécutoire.</label>\n      <label><input type=\"checkbox\"> J’ai vérifié les voies et délais de recours si nécessaire.</label>\n    </section>\n  </div>\n</div>\n\n<div class=\"three-stop-alerts\">\n  <div><span>STOP</span><strong>Compétence incertaine</strong><small>Je ne finalise pas sans vérification.</small></div>\n  <div><span>STOP</span><strong>Délégation absente ou ambiguë</strong><small>Je ne lance pas le circuit de signature.</small></div>\n  <div><span>STOP</span><strong>Procédure non sécurisée</strong><small>Je sollicite l’expertise adaptée.</small></div>\n</div>\n"}, {"eyebrow": "Conclusion", "title": "Votre premier outil n’est plus l’ancien modèle", "body": "\n<div class=\"final-hero\">\n  <div class=\"final-message\">\n    <p class=\"final-question\">Quand on vous demande :</p>\n    <blockquote>« Peux-tu préparer l’acte ? »</blockquote>\n    <p class=\"final-shift\">votre premier réflexe devient :</p>\n    <div class=\"final-answer\">« Qu’est-ce que je dois vérifier avant de rédiger ? »</div>\n  </div>\n\n  <div class=\"final-method-wheel\" aria-hidden=\"true\">\n    <div class=\"wheel-center\">ACTE<br><small>sécurisé</small></div>\n    <div class=\"wheel-item wi1\">Compétence</div>\n    <div class=\"wheel-item wi2\">Fondement</div>\n    <div class=\"wheel-item wi3\">Rédaction</div>\n    <div class=\"wheel-item wi4\">Signature</div>\n    <div class=\"wheel-item wi5\">Formalités</div>\n  </div>\n</div>\n\n<div class=\"final-3\">\n  <div class=\"final-card\">\n    <span>1</span><strong>Identifier</strong>\n    <p>Le cadre, la compétence, l’autorité et la nature de l’acte.</p>\n  </div>\n  <div class=\"final-card\">\n    <span>2</span><strong>Préparer</strong>\n    <p>Les fondements, les faits utiles, la motivation et le dispositif.</p>\n  </div>\n  <div class=\"final-card\">\n    <span>3</span><strong>Sécuriser</strong>\n    <p>La signature, la délégation, les formalités et le besoin éventuel d’expertise.</p>\n  </div>\n</div>\n\n<div class=\"closing-sentence\">\n  <span class=\"closing-line\"></span>\n  <strong>Un acte sécurisé commence avant la rédaction et ne se termine pas avec la signature.</strong>\n  <span class=\"closing-line\"></span>\n</div>\n\n<div class=\"completion-note\">\n  <span>✓</span>\n  <div><strong>Module terminé</strong><small>Votre progression est enregistrée.</small></div>\n</div>\n"}];
const sections = [{"label": "Comprendre la méthode", "start": 0, "end": 7}, {"label": "Commune", "start": 8, "end": 12}, {"label": "Province", "start": 13, "end": 18}, {"label": "Nouvelle-Calédonie", "start": 19, "end": 24}, {"label": "Établissement public", "start": 25, "end": 28}, {"label": "Consolider", "start": 29, "end": 33}];
let state={screen:0,answered:{}}, scormReady=false;

function currentSection(i){
  return sections.findIndex(s=>i>=s.start && i<=s.end);
}
function sectionProgress(si){
  const s=sections[si], total=s.end-s.start+1;
  const viewed=Math.max(0,Math.min(total,state.screen-s.start+1));
  return `${viewed} / ${total}`;
}
function boot(){
  scormReady=SCORM.init();
  if(scormReady){
    const loc=parseInt(SCORM.get("cmi.core.lesson_location")||"0",10);
    if(!isNaN(loc)&&loc>=0&&loc<screens.length) state.screen=loc;
    const st=SCORM.get("cmi.core.lesson_status");
    if(!st||st==="not attempted") SCORM.set("cmi.core.lesson_status","incomplete");
    const susp=SCORM.get("cmi.suspend_data");
    if(susp) try{const x=JSON.parse(susp); if(x.answered) state.answered=x.answered;}catch(e){}
    SCORM.commit();
  } else {
    const saved=localStorage.getItem("actes_admin_state_manager_ia");
    if(saved) try{state={...state,...JSON.parse(saved)}}catch(e){}
  }
  renderRail(); render();
}
function save(){
  if(scormReady){
    SCORM.set("cmi.core.lesson_location",state.screen);
    SCORM.set("cmi.suspend_data",JSON.stringify({answered:state.answered}).slice(0,3900));
    if(state.screen===screens.length-1) SCORM.set("cmi.core.lesson_status","completed");
    SCORM.commit();
  } else localStorage.setItem("actes_admin_state_manager_ia",JSON.stringify(state));
}
function topOfScreen(){
  requestAnimationFrame(()=>{
    window.scrollTo({top:0,left:0,behavior:"auto"});
    const t=document.getElementById("screenTitle");
    if(t){t.setAttribute("tabindex","-1");t.focus({preventScroll:true});}
  });
}
function goTo(i){
  const n=Math.max(0,Math.min(screens.length-1,i));
  if(n===state.screen) return;
  state.screen=n; save(); render(); renderRail(); topOfScreen();
}
function go(delta){goTo(state.screen+delta);}

function renderRail(){
  const si=currentSection(state.screen);
  const html=sections.map((s,i)=>`
    <button class="section-btn ${i===si?"active":""}" data-section="${i}" ${i===si?'aria-current="step"':""}>
      ${s.label}
      <span class="section-meta">${i<si?"Terminé":i===si?sectionProgress(i):"À venir"}</span>
    </button>`).join("");
  document.getElementById("railList").innerHTML=html;
  document.getElementById("drawerList").innerHTML=html;
  document.querySelectorAll("[data-section]").forEach(b=>b.addEventListener("click",()=>{goTo(sections[Number(b.dataset.section)].start);closeDrawer();}));
}

function render(){
  const s=screens[state.screen], si=currentSection(state.screen), sec=sections[si];
  document.getElementById("sectionName").textContent=sec.label;
  document.getElementById("screenCount").textContent=`Repère ${state.screen-sec.start+1} / ${sec.end-sec.start+1}`;
  document.getElementById("bar").style.width=`${(state.screen+1)/screens.length*100}%`;
  document.getElementById("prev").disabled=state.screen===0;
  document.getElementById("next").textContent=state.screen===screens.length-1?"Terminé":"Suivant →";
  document.getElementById("next").disabled=!!s.activity&&!state.answered[state.screen];

  document.getElementById("screenHost").innerHTML=`
    <section class="screen" aria-labelledby="screenTitle">
      <div class="hero-band">
        <div class="eyebrow">${s.eyebrow||sec.label}</div>
        <h1 id="screenTitle">${s.title}</h1>
      </div>
      <div class="content">${s.body||""}${activityHTML(s.activity)}</div>
    </section>`;
  bindActivity(s.activity);
  save();
}

function activityHTML(a){
  if(!a)return "";
  if(a.type==="choice"){
    return `<div class="choice-list" role="group" aria-label="Choisissez une réponse">
      ${a.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="choice-key">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}
      </div><div class="submit-row"><button class="primary" id="submitAct" disabled>Valider</button></div><div id="feedback" class="feedback"></div>`;
  }
  if(a.type==="multi"||a.type==="hotspots"){
    return `<div class="${a.type==="hotspots"?"hotspot-grid":"choice-list"}" role="group" aria-label="Sélection multiple">
      ${a.choices.map((c,i)=>a.type==="hotspots"
      ?`<button class="hotspot" data-i="${i}">${c}</button>`
      :`<button class="choice" data-i="${i}"><span class="choice-key">✓</span><span>${c}</span></button>`).join("")}
      </div><div class="submit-row"><button class="primary" id="submitAct" disabled>Valider</button></div><div id="feedback" class="feedback"></div>`;
  }
  return "";
}
function bindActivity(a){
  if(!a)return;
  const cls=a.type==="hotspots"?".hotspot":".choice", buttons=[...document.querySelectorAll(cls)];
  const submit=document.getElementById("submitAct"); let selected=[];
  buttons.forEach(b=>b.addEventListener("click",()=>{
    const i=Number(b.dataset.i);
    if(a.type==="choice"){selected=[i];buttons.forEach(x=>x.classList.remove("selected"));b.classList.add("selected");}
    else if(selected.includes(i)){selected=selected.filter(x=>x!==i);b.classList.remove(a.type==="hotspots"?"sel":"selected");}
    else{selected.push(i);b.classList.add(a.type==="hotspots"?"sel":"selected");}
    submit.disabled=!selected.length;
  }));
  submit.addEventListener("click",()=>{
    let ok=false,msg="";
    if(a.type==="choice"){
      const i=selected[0];ok=i===a.correct;msg=a.feedback[i]||"";
      buttons.forEach((b,j)=>{b.disabled=true;if(j===a.correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});
    } else {
      const c=[...a.correct].sort((x,y)=>x-y),g=[...selected].sort((x,y)=>x-y);ok=JSON.stringify(c)===JSON.stringify(g);msg=a.feedback;
      buttons.forEach((b,j)=>{b.disabled=true;if(c.includes(j))b.classList.add(a.type==="hotspots"?"good":"correct");else if(selected.includes(j))b.classList.add(a.type==="hotspots"?"bad":"wrong")});
    }
    const f=document.getElementById("feedback");f.className=`feedback show ${ok?"good":"bad"}`;f.innerHTML=`<strong>${ok?"Bien vu.":"À retenir."}</strong><br>${msg}`;
    state.answered[state.screen]=true;save();document.getElementById("next").disabled=false;submit.disabled=true;
  });
}
function openDrawer(){document.getElementById("drawer").classList.add("open");document.getElementById("backdrop").classList.add("show")}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("backdrop").classList.remove("show")}
window.addEventListener("beforeunload",()=>{save();SCORM.finish();});
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("prev").addEventListener("click",()=>go(-1));
  document.getElementById("next").addEventListener("click",()=>{if(state.screen<screens.length-1)go(1);else save();});
  document.getElementById("menuBtn").addEventListener("click",openDrawer);
  document.getElementById("backdrop").addEventListener("click",closeDrawer);
  boot();
});
</script>
</body>
</html>
