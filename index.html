<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rédiger et sécuriser un acte administratif en Nouvelle-Calédonie</title>
<style>
:root{
  --bg:#f5f3f8;
  --paper:#ffffff;
  --ink:#262232;
  --muted:#726b7e;
  --violet:#5f4a88;
  --violet-soft:#eee9f5;
  --coral:#e97b73;
  --coral-soft:#fff0ee;
  --line:#e6e0eb;
  --ok:#31785b;
  --warn:#9b6523;
  --danger:#a94949;
  --focus:#245fc2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Lato,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#app{min-height:100vh;display:grid;grid-template-columns:196px minmax(0,1fr)}
.rail{
  position:fixed;inset:0 auto 0 0;width:196px;background:#fff;border-right:1px solid var(--line);
  padding:22px 14px 88px;overflow-y:auto;scrollbar-width:none;z-index:30
}
.rail::-webkit-scrollbar{display:none}
.rail-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900;margin:0 10px 18px}
.section-btn{
  width:100%;border:0;background:transparent;text-align:left;padding:12px 10px 12px 14px;border-radius:10px;
  color:#5d5668;cursor:pointer;position:relative;line-height:1.25;font-weight:700
}
.section-btn:hover{background:#f8f6fa}
.section-btn.active{background:#f8f5fb;color:var(--violet)}
.section-btn.active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:8px;background:var(--coral)
}
.section-meta{display:block;font-size:12px;color:#8e8797;font-weight:500;margin-top:4px}
.main{grid-column:2;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:15px 28px 13px
}
.toprow{display:flex;align-items:flex-start;gap:20px}
.course{min-width:0;flex:1}
.course small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}
.course strong{display:block;font-size:17px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{text-align:right;min-width:155px}
.where strong{display:block;color:var(--violet);font-size:14px}
.where span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.progress{height:5px;background:#eeeaf1;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--violet),var(--coral));width:0;transition:width .25s}
.stage{width:min(1020px,100%);margin:0 auto;padding:28px 30px 122px}
.screen{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;min-height:640px;
  box-shadow:0 12px 34px rgba(56,45,72,.06);overflow:hidden
}
.hero-band{padding:26px 34px 20px;border-bottom:1px solid var(--line);background:#fff}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;color:var(--violet);font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em
}
.eyebrow::before{content:"";width:26px;height:3px;border-radius:99px;background:var(--coral)}
h1,h2,h3{margin:0}
h1{font-size:36px;line-height:1.1;margin-top:9px}
h2{font-size:28px;line-height:1.2}
h3{font-size:20px}
.content{padding:30px 34px 34px;line-height:1.55}
.lead{font-size:21px;color:#453f50;line-height:1.48;max-width:860px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid var(--line);background:#fff;border-radius:15px;padding:18px}
.card.soft{background:#faf8fb}
.card h3{margin-bottom:8px}
.quote{border-left:4px solid var(--coral);background:var(--coral-soft);padding:18px 20px;border-radius:10px;font-size:20px}
.callout{border-radius:14px;padding:17px 19px;margin:18px 0}
.callout.ok{background:#eef8f3;border:1px solid #bddfce}
.callout.warn{background:#fff6e9;border:1px solid #ecd1ab}
.callout.danger{background:#fff0f0;border:1px solid #e8c0c0}
.callout.info{background:var(--violet-soft);border:1px solid #d9cfea}
.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:var(--violet-soft);color:var(--violet)}
.person{display:grid;grid-template-columns:74px 1fr;gap:16px;align-items:center;margin-bottom:20px}
.avatar{
  width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#7a67a5,#ef938b);
  display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900
}
.doc{
  background:#fff;border:1px solid #d9d4dc;border-radius:13px;padding:20px;box-shadow:0 7px 20px rgba(47,39,58,.05);
  font-family:Georgia,serif;font-size:16px;line-height:1.55
}
.doc .center{text-align:center}.doc .article{font-weight:700;margin-top:13px}
.method{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.method .m{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}
.method .n{font-size:12px;font-weight:900;color:var(--coral);display:none}
.method .q{font-weight:800}
.choice-list{display:grid;gap:12px;margin-top:20px}
.choice{
  display:flex;gap:13px;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:15px 16px;cursor:pointer;transition:.12s
}
.choice:hover{border-color:#cdbfe0;background:#fcfbfd}
.choice.selected{border:2px solid var(--violet);background:#f7f3fb}
.choice.correct{border:2px solid var(--ok);background:#eef8f3}
.choice.wrong{border:2px solid var(--danger);background:#fff2f2}
.choice-key{
  width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:#f0edf3;display:grid;place-items:center;font-weight:900;
  font-size:13px
}
.submit-row{display:flex;gap:12px;align-items:center;margin-top:17px}
.primary{
  border:none;background:var(--violet);color:#fff;border-radius:11px;padding:12px 18px;font-weight:900;cursor:pointer
}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{
  border:1px solid var(--line);background:#fff;color:#4f4859;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer
}
.feedback{margin-top:17px;border-radius:13px;padding:16px 18px;display:none}
.feedback.show{display:block}
.feedback.good{background:#eef8f3;border:1px solid #bddfce}
.feedback.bad{background:#fff4ec;border:1px solid #efc8ae}
.alert3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.alert3 .a{border-radius:14px;padding:16px}
.alert3 .green{background:#eef8f3;border:1px solid #bddfce}
.alert3 .orange{background:#fff6e9;border:1px solid #ecd1ab}
.alert3 .red{background:#fff0f0;border:1px solid #e8c0c0}
.checks{display:grid;gap:10px;margin-top:17px}
.check{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.small,.footer-note{font-size:13px;color:var(--muted)}
.hotspot-grid{display:grid;gap:10px;margin-top:16px}
.hotspot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;text-align:left;cursor:pointer}
.hotspot.sel{border:2px solid var(--violet);background:#f7f3fb}
.hotspot.good{border:2px solid var(--ok);background:#eef8f3}
.hotspot.bad{border:2px solid var(--danger);background:#fff2f2}
.nav{
  position:fixed;left:196px;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:13px 28px;z-index:25
}
.nav-inner{width:min(1020px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-center{font-size:13px;color:var(--muted);text-align:center}
.mobile-menu{display:none}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.summary-grid .card{min-height:112px}
@media(max-width:820px){
  #app{display:block}.rail{display:none}.main{grid-column:auto}.nav{left:0}
  .mobile-menu{display:inline-flex}
  .topbar{padding:13px 16px}.where{min-width:auto}.course strong{font-size:15px}
  .stage{padding:18px 12px 110px}.screen{border-radius:14px;min-height:auto}
  .hero-band,.content{padding:21px 19px}h1{font-size:30px}
  .grid2,.grid3,.method,.alert3,.summary-grid{grid-template-columns:1fr}
  .nav{padding:10px 12px}.nav-center{display:none}
}
.drawer{
  position:fixed;inset:0 auto 0 0;width:min(320px,88vw);background:#fff;z-index:60;padding:22px 14px;
  transform:translateX(-105%);transition:.2s;border-right:1px solid var(--line)
}
.drawer.open{transform:translateX(0)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:55;display:none}
.backdrop.show{display:block}


/* ===== v0.4 : enrichissement écrans 1 à 5, navigation v0.3 inchangée ===== */
.intro-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:34px;align-items:center}
.intro-hook{font-size:29px;line-height:1.25;margin:0 0 14px;color:var(--violet);font-weight:700}
.mission-card{margin-top:24px;border:1px solid #d9cfea;background:linear-gradient(135deg,#f8f5fb,#fff);border-radius:17px;padding:18px 20px}
.mission-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--coral);margin-bottom:6px}
.mission-text{font-size:18px;font-weight:700;line-height:1.45}
.intro-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.intro-meta span{min-width:128px;border-top:2px solid var(--line);padding-top:9px}
.intro-meta strong{display:block;font-size:16px;color:var(--violet)}
.intro-meta small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.intro-visual{display:grid;place-items:center;min-height:315px}
.desk-scene{position:relative;width:300px;height:280px}
.doc-back,.doc-mid,.doc-front{position:absolute;width:205px;height:245px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(56,45,72,.10)}
.doc-back{left:26px;top:18px;transform:rotate(-7deg);background:#f8f5fb}
.doc-mid{left:54px;top:11px;transform:rotate(5deg);background:#fff8f7}
.doc-front{left:45px;top:27px;padding:34px 23px}
.doc-line{height:7px;background:#e8e4ec;border-radius:10px;margin-bottom:13px}.w70{width:70%}.w90{width:90%}.w78{width:78%}
.doc-seal{position:absolute;right:18px;bottom:20px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);font-size:24px;font-weight:900;border:1px dashed #b9acd0}
.check-chip{position:absolute;background:#fff;border:1px solid var(--line);box-shadow:0 9px 24px rgba(56,45,72,.10);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900}
.chip-a{left:0;top:57px;color:var(--violet)}.chip-b{right:1px;top:120px;color:#a54e48}.chip-c{left:6px;bottom:36px;color:#446d5a}
.start-note{display:flex;gap:12px;align-items:flex-start;margin-top:27px;padding-top:18px;border-top:1px solid var(--line);color:#514a5b}
.start-dot{width:10px;height:10px;border-radius:50%;background:var(--coral);margin-top:8px;flex:0 0 10px}

.message-stage{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#faf9fb;box-shadow:0 8px 24px rgba(56,45,72,.05)}
.message-head{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);background:#fff}
.message-head small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#5aa77f;flex:0 0 10px}
.urgent-pill{margin-left:auto;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;background:var(--coral-soft);color:#9c4d47;border-radius:999px;padding:5px 9px}
.message-bubble{max-width:710px;margin:24px 22px 28px;background:#fff;border:1px solid #ded6e5;border-left:4px solid var(--violet);border-radius:8px 15px 15px 15px;padding:18px 20px;font-size:21px;line-height:1.45}
.old-file-row{display:flex;gap:16px;align-items:center;margin:24px 0 20px;padding:15px 17px;border:1px dashed #cfc6d7;border-radius:14px;background:#fff}
.old-file-row p{margin:3px 0 0;color:var(--muted)}
.old-file-icon{width:50px;height:58px;border:2px solid #b8acc5;border-radius:7px;padding:10px 8px;flex:0 0 50px;position:relative;background:#faf8fb}
.old-file-icon:after{content:"2 ans";position:absolute;right:-11px;top:-10px;background:var(--coral);color:#fff;font-size:10px;font-weight:900;padding:3px 5px;border-radius:6px}
.old-file-icon span{display:block;height:4px;background:#d9d1e0;border-radius:5px;margin:5px 0}
.decision-prompt{margin-top:20px}.decision-prompt strong{display:block;font-size:20px;margin-top:5px}
.decision-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);font-weight:900}

.logic-split{display:grid;grid-template-columns:1fr 54px 1fr;gap:16px;align-items:stretch}
.logic-panel{border-radius:17px;padding:21px 22px;border:1px solid var(--line)}
.model-panel{background:#faf8fb}.secure-panel{background:#fff7f5;border-color:#f1cbc7}
.logic-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted);margin-bottom:7px}
.secure-panel .logic-label{color:#a5544e}
.logic-arrow{display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--coral)}
.clean-list{margin:14px 0 0;padding:0;list-style:none}.clean-list li{position:relative;padding:8px 0 8px 22px;border-top:1px solid rgba(0,0,0,.05)}
.clean-list li:before{content:"";position:absolute;left:1px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.model-panel .clean-list li:before{background:#aaa1b6}
.key-sentence{display:flex;gap:14px;align-items:center;margin-top:22px;padding:17px 19px;border-radius:14px;background:var(--violet-soft);border:1px solid #d8cfea}
.key-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--violet);color:#fff;font-weight:900;flex:0 0 34px}
.micro-question{margin-top:15px;border-left:3px solid var(--coral);padding:5px 0 5px 15px}.micro-question strong{display:block}.micro-question span{color:var(--muted)}

.flowline{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;gap:7px;align-items:stretch;margin-top:6px}
.flow-step{border-radius:17px;padding:20px 18px;border:1px solid var(--line);position:relative;overflow:hidden}
.flow-step:after{content:"";position:absolute;inset:auto 0 0;height:5px}
.flow-step.before{background:#f8f5fb}.flow-step.before:after{background:var(--violet)}
.flow-step.during{background:#fff}.flow-step.during:after{background:#9987ba}
.flow-step.after{background:#fff7f5}.flow-step.after:after{background:var(--coral)}
.flow-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-weight:900;color:var(--violet);margin-bottom:18px}
.flow-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}
.flow-text h3{margin-top:4px}.flow-text p{margin-bottom:4px;color:#56505e}
.flow-connector{display:grid;place-items:center;color:#b4a9bd;font-size:28px;font-weight:700}
.risk-strip{display:flex;gap:15px;align-items:flex-start;margin-top:25px;padding:18px 20px;border:1px solid #e8c6c2;border-radius:15px;background:var(--coral-soft)}
.risk-strip p{margin:4px 0 0;color:#5b5050}.risk-symbol{width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;font-weight:900;display:grid;place-items:center;flex:0 0 34px}

.compact-lead{max-width:760px;margin-top:0}
.questions-cluster{display:grid;grid-template-columns:1.45fr .8fr .9fr;gap:14px;margin-top:22px}
.cluster{border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0}
.cluster-a{background:#f8f5fb}.cluster-b{background:#fff}.cluster-c{background:#fff7f5}
.cluster-head{display:flex;gap:12px;align-items:center;padding-bottom:13px;border-bottom:1px solid rgba(100,80,120,.11)}
.cluster-num{font-size:14px;font-weight:900;color:var(--coral);letter-spacing:.05em}
.cluster-head small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.09em;font-weight:900;color:var(--muted)}
.cluster-head h3{margin-top:2px}
.question-chips{display:grid;gap:8px;margin-top:14px}
.question-chips span{display:block;border-radius:10px;background:rgba(255,255,255,.82);border:1px solid rgba(110,90,130,.11);padding:9px 10px;font-size:14px;line-height:1.3;font-weight:700}
.remember-band{display:flex;gap:14px;align-items:center;margin-top:20px;padding:15px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.remember-eye{font-size:26px;color:var(--violet);font-weight:900}

@media(max-width:820px){
  .intro-layout{grid-template-columns:1fr}.intro-visual{min-height:270px}.desk-scene{transform:scale(.9);transform-origin:center}
  .intro-hook{font-size:25px}.message-bubble{font-size:18px;margin:18px 15px 22px}
  .logic-split{grid-template-columns:1fr}.logic-arrow{min-height:36px}
  .flowline{grid-template-columns:1fr}.flow-connector{transform:rotate(90deg);min-height:28px}
  .questions-cluster{grid-template-columns:1fr}
}

/* ===== v0.5 : dossier Commune, écrans 6 à 10 ===== */
.case-opening{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.28fr);gap:22px;margin-bottom:20px}
.case-person{display:flex;gap:15px;align-items:center;border:1px solid var(--line);border-radius:17px;padding:17px;background:#faf8fb}
.person-portrait{width:84px;height:104px;border-radius:18px;display:grid;place-items:center;flex:0 0 84px;position:relative;overflow:hidden;background:linear-gradient(160deg,#d7cdea,#fff0ec)}
.person-portrait:before{content:"";position:absolute;width:54px;height:54px;border-radius:50%;background:#c7badb;top:15px}
.person-portrait:after{content:"";position:absolute;width:68px;height:55px;border-radius:50% 50% 12px 12px;background:#6d5a83;bottom:-7px}
.person-portrait span{position:relative;z-index:2;color:#fff;font-weight:900;font-size:18px;margin-top:-14px}
.person-caption h3{margin:4px 0 5px}.person-caption p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.role-tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:var(--coral)}
.case-context{border-left:4px solid var(--violet);padding:11px 0 6px 19px}.case-context p{font-size:18px;line-height:1.5;margin:7px 0}
.case-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900}
.manager-request{display:flex;gap:14px;align-items:flex-start;background:#fff7f5;border:1px solid #efc9c4;border-radius:15px;padding:16px 18px;margin:18px 0}
.manager-request small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:#9a554f;font-weight:900;margin-bottom:4px}
.manager-request strong{font-size:18px;line-height:1.4}.manager-mark{color:var(--coral);font-size:25px;font-weight:900;line-height:1}
.dossier-table{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0 22px}
.dossier-piece{border:1px solid var(--line);border-radius:16px;padding:17px;min-height:190px;position:relative;overflow:hidden}
.dossier-piece:after{content:"";position:absolute;height:5px;left:0;right:0;bottom:0}.piece-mail{background:#faf8fb}.piece-mail:after{background:#8c78a5}.piece-map{background:#fff}.piece-map:after{background:#7d9c8b}.piece-law{background:#fff7f5}.piece-law:after{background:var(--coral)}
.piece-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:26px}.piece-icon{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--violet)}
.piece-type{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;text-align:right}.dossier-piece h3{font-size:18px}.dossier-piece p{color:#5c5662;line-height:1.45}
.focus-question{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:18px}.focus-question span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);flex:0 0 85px}.focus-question strong{font-size:18px}
.decision-sheet{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(56,45,72,.05)}

/* ===== v1.1 : intégration des visuels maîtres ===== */

/* ===== v1.3 : passe graphique générale + images bord à bord ===== */

  --bg:#f3f1f6;

  --coral-deep:#c85e57;
  --coral-soft:#fff0ee;
  --line:#e4dfea;
  --line-strong:#d7d0df;
  --ok:#31785b;
  --warn:#9b6523;
  --danger:#a94949;
  --focus:#245fc2;
  --shadow-sm:0 6px 18px rgba(53,43,67,.06);
  --shadow-md:0 18px 48px rgba(53,43,67,.10);
}

body{
  background:
    radial-gradient(circle at 92% 8%, rgba(232,119,111,.08), transparent 22rem),
    radial-gradient(circle at 5% 82%, rgba(93,71,134,.07), transparent 26rem),
    var(--bg);
}

.stage{width:min(1100px,100%);padding:32px 34px 126px}
.screen{
  border:1px solid rgba(215,208,223,.95);
  border-radius:24px;
  min-height:650px;
  box-shadow:var(--shadow-md);
  background:rgba(255,255,255,.99);
  animation:screenIn .20s ease-out;
}
@keyframes screenIn{from{opacity:.7;transform:translateY(5px)}to{opacity:1;transform:none}}

.hero-band{
  position:relative;
  padding:29px 38px 22px;
  background:linear-gradient(180deg,#fff 0%,#fdfcfe 100%);
}
.hero-band::after{
  content:"";position:absolute;left:38px;right:38px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--coral) 0 52px,var(--line) 52px 100%);
}
h1{font-size:38px;letter-spacing:-.018em;max-width:900px}
.content{padding:32px 38px 38px}

.topbar{
  background:rgba(255,255,255,.94);
  box-shadow:0 4px 18px rgba(53,43,67,.035);
}
.progress{height:4px;background:#eeeaf2}
.progress>div{background:linear-gradient(90deg,var(--violet),#8b70ad 62%,var(--coral))}
.course strong{color:#383042}
.where strong{font-weight:900}

.section-btn{transition:background .15s,color .15s,transform .15s}
.section-btn:hover{background:#f7f4fa;transform:translateX(2px)}
.section-btn.active{background:linear-gradient(90deg,#f5f0fa,#fbf9fc)}
.section-btn.active::before{width:3px;top:8px;bottom:8px;background:var(--coral)}

.primary{
  background:linear-gradient(135deg,var(--violet),#725b9a);
  box-shadow:0 7px 18px rgba(93,71,134,.18);
  transition:transform .14s,box-shadow .14s,filter .14s;
}
.primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(93,71,134,.23);filter:saturate(1.05)}
.secondary{box-shadow:0 3px 10px rgba(53,43,67,.035);transition:transform .14s,border-color .14s,background .14s}
.secondary:hover{transform:translateY(-1px);border-color:#cfc6d8;background:#fcfbfd}

.choice,.hotspot{
  box-shadow:0 3px 11px rgba(53,43,67,.025);
  transition:border-color .14s,background .14s,box-shadow .14s,transform .14s;
}
.choice:hover,.hotspot:hover{box-shadow:0 8px 20px rgba(53,43,67,.07);transform:translateY(-1px)}
.choice.selected,.hotspot.sel{box-shadow:0 8px 22px rgba(93,71,134,.10)}
.choice-key{background:linear-gradient(180deg,#f4f1f6,#ece8f0);color:#5d5267}

.card,.mission-card,.logic-panel,.flow-step,.cluster,.dossier-piece,.regime-card,.reason-node,
.resource-card,.competence-box,.method-time,.auto-zone,.final-card,.checklist-sheet{
  box-shadow:var(--shadow-sm);
}

.callout,.risk-strip,.key-sentence,.manager-request,.gap-alert,.lifecycle-note,.act-type-warning{
  box-shadow:0 5px 16px rgba(53,43,67,.035);
}

/* --- Visuels maîtres : le placeholder est intégralement occupé --- */
.master-visual-wrap{
  width:100%;
  overflow:hidden;
  border-radius:19px;
  border:1px solid var(--line);
  background:#ece8ef;
  box-shadow:0 16px 38px rgba(56,45,72,.11);
}
.master-visual{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border:0;
  border-radius:0;
  box-shadow:none;
}
.intro-layout{grid-template-columns:minmax(0,1.04fr) minmax(350px,.96fr);gap:36px}
.intro-visual.master-visual-wrap{
  min-height:0;
  aspect-ratio:6/5;
}
.opening-master{object-position:50% 48%}

/* Les personnages deviennent de vrais visuels de dossier, plus de mini-vignettes. */
.case-opening{grid-template-columns:minmax(285px,.82fr) minmax(0,1.18fr);gap:24px}
.case-person{
  display:grid;
  grid-template-columns:1fr;
  align-content:start;
  gap:0;
  padding:0;
  overflow:hidden;
  background:#fff;
  box-shadow:var(--shadow-sm);
}
.case-photo-frame{
  width:100%;
  height:auto;
  aspect-ratio:6/5;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  box-shadow:none;
  background:#eae6ed;
  flex-basis:auto;
}
.case-photo{width:100%;height:100%;object-fit:cover;display:block}
.person-caption{padding:15px 17px 17px}
.person-caption h3{font-size:22px}
.person-caption p{font-size:13px}
.province-case .case-photo,.nc-case .case-photo,.ep-case .case-photo{object-position:center center}

/* Le visuel de relecture reste généreux sans devenir une bannière trop basse. */
.synthesis-master-wrap{
  width:min(720px,100%);
  margin:4px auto 22px;
  aspect-ratio:6/5;
  overflow:hidden;
  border-radius:19px;
  border:1px solid var(--line);
  background:#ece8ef;
  box-shadow:var(--shadow-md);
}
.synthesis-master{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:center}

/* Hiérarchie plus éditoriale */
.lead{color:#4a4351}
.intro-hook{font-size:31px;letter-spacing:-.01em}
.mission-card{border-color:#d7cbe5;background:linear-gradient(135deg,#f6f2fa 0%,#fff 72%)}
.mission-label,.decision-label,.role-tag{color:var(--coral-deep)}
.key-mark,.risk-symbol,.outside-mark,.gap-icon{box-shadow:0 5px 14px rgba(232,119,111,.18)}
.question-chips span{border-color:#e1dbe6;box-shadow:0 2px 8px rgba(53,43,67,.025)}
.fake-act,.act-paper,.signature-paper,.decision-sheet{box-shadow:0 14px 36px rgba(53,43,67,.085)}

/* Navigation basse plus légère et alignée au contenu. */
.nav{
  background:rgba(255,255,255,.95);
  box-shadow:0 -7px 24px rgba(53,43,67,.045);
}
.nav-inner{width:min(1100px,100%)}

/* Mobile */
@media(max-width:820px){
  .stage{padding:18px 12px 112px}
  .screen{border-radius:16px}
  .hero-band,.content{padding-left:21px;padding-right:21px}
  .hero-band::after{left:21px;right:21px}
  h1{font-size:30px}
  .intro-layout{grid-template-columns:1fr}
  .intro-visual.master-visual-wrap{aspect-ratio:4/3}
  .case-opening{grid-template-columns:1fr}
  .case-photo-frame{aspect-ratio:16/10}
  .synthesis-master-wrap{aspect-ratio:4/3}
}

@media(max-width:820px){
  .pedago-info-wrap{margin:18px auto 20px;padding:6px;border-radius:15px}

}

<script>
var SCORM = (function(){
  var api=null, initialized=false;
  function findAPI(win){
    var tries=0;
    while(win && tries<10){
      if(win.API) return win.API;
      if(win.parent===win) break;
      win=win.parent; tries++;
    }
    if(window.opener) {
      try { return findAPI(window.opener); } catch(e){}
    }
    return null;
  }
  function init(){
    api=findAPI(window);
    if(!api) return false;
    try{
      initialized=(api.LMSInitialize("")==="true");
      return initialized;
    }catch(e){return false;}
  }
  function get(k){ if(!initialized) return ""; try{return api.LMSGetValue(k)||"";}catch(e){return "";}}
  function set(k,v){ if(!initialized) return false; try{return api.LMSSetValue(k,String(v))==="true";}catch(e){return false;}}
  function commit(){ if(initialized){try{api.LMSCommit("");}catch(e){}}}
  function finish(){ if(initialized){try{api.LMSFinish("");}catch(e){} initialized=false;}}
  return {init:init,get:get,set:set,commit:commit,finish:finish};
})();
</script>
